name: Build Anime Prompt Builder APK

on:
  push:
    branches:
      - anime-prompt-builder-apk
    paths:
      - 'android-anime-prompt-builder/**'
      - '.github/workflows/build-anime-prompt-builder-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle -p android-anime-prompt-builder assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          test -s android-anime-prompt-builder/app/build/outputs/apk/release/app-release.apk
          ls -lh android-anime-prompt-builder/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp android-anime-prompt-builder/app/build/outputs/apk/release/app-release.apk AnimePromptBuilder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimePromptBuilder-apk
          path: AnimePromptBuilder.apk
          if-no-files-found: error
          retention-days: 14
