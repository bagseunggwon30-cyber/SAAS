function lessonProgressSave(){if(!L.lesson)return;prog.last={id:L.lesson.id,seg:LS_SEG()};saveProg();}
/* 비트 수: say 직후, step/beat(앞에 내용이 있을 때), 마지막 꼬리 */
function countBeats(ops){
  let n=0,since=0;
  for(const o of ops){
    if(!o)continue;
    if(o.t==='say'){n++;since=0;}
    else if(o.t==='step'||o.t==='beat'){if(since>0){n++;since=0;}}
    else since++;
  }
  if(since>0)n++;
  return Math.max(1,n);
}
function startLesson(idx,resumeSeg){
  const lesson=LESSONS[idx];if(!lesson)return;
  abortAI();aiRunner.reset();lessonRunner.reset();demoRunner.reset();DM.last=null;updateDemoBtn();
  laserOff();hideCaption();tapHint.hidden=true;camBeat();hideFinger(true);
  capStrip(true);
  clearBoard();margin.textContent='';recentSays.length=0;clearInk(true);
  SIM.hinted=new Set();SIM.used=new Set();
  L.idx=idx;L.lesson=lesson;L.status='play';L.beatNo=0;L.since=0;
  L.segTotal=countBeats(lesson.ops);
  L.fastUntil=resumeSeg&&resumeSeg>1?resumeSeg-1:0;
  lessonRunner.fast=L.fastUntil>0;
  $('#lbar').hidden=false;updateLbar();closeDrawer();
  history.length=0;
  prog.last={id:lesson.id,seg:1};saveProg();
  simEnable(true,true);
  lessonRunner.push(lesson.ops.map(o=>o),null);
  fitView();
}
/* 비트 끝: 클릭을 기다린다 (fast 중이면 목표 비트까지 그냥 지나감) */
async function beatPause(R,tok){
  if(R.kind!=='lesson')return;
  if(L.beatNo<L.fastUntil){L.beatNo++;L.since=0;camBeat();return;}
  if(!R.queue.some(q=>q.op&&q.op.t!=='step'&&q.op.t!=='beat'))return;
  R.fast=false;L.status='wait';L.since=0;
  lessonProgressSave();updateLbar();tapHint.hidden=false;
  await new Promise(r=>{R.waiting=r;});
  if(tok!==R.tok)throw CANCEL;
  L.beatNo++;L.status='play';camBeat();tapHint.hidden=true;updateLbar();
}
lessonRunner.onIdle=function(){
  if(!L.lesson||L.status!=='play')return;
  L.status='done';lessonRunner.fast=false;tapHint.hidden=true;
  if(prog.done.indexOf(L.lesson.id)<0)prog.done.push(L.lesson.id);
  prog.last={id:L.lesson.id,seg:L.segTotal,finished:true};saveProg();
  updateLbar();renderLessonList();
};
function updateLbar(){
  const lb=$('#lbar');if(!L.lesson){lb.hidden=true;return;}
  lb.hidden=false;
  $('#lbTitle').textContent=lessonLabel(L.lesson);
  const n=L.status==='done'?L.segTotal:LS_SEG();
  $('#lbStep').textContent=L.status==='done'?'완료':(n+' / '+L.segTotal);
  $('#lbProgI').style.width=(100*n/L.segTotal)+'%';
  const next=$('#lbNext');
  if(L.status==='done'){
    const has=L.idx<LESSONS.length-1;next.textContent=has?'다음 강의 ▶':'마지막 강의예요';next.disabled=!has;
  }else{next.textContent='다음 ▶';next.disabled=false;}
  $('#lbPrev').disabled=n<=1;
}
/* 클릭 1번 = 한 비트. 비트가 재생 중이면 그 비트를 즉시 완성 */
function advance(){
  if(!L.lesson)return;
  const R=lessonRunner;
  if(L.status==='wait'&&R.waiting){const w=R.waiting;R.waiting=null;w();}
  else if(L.status==='play'){R.fast=true;R.flush();}
}
function prevBeat(){
  if(!L.lesson)return;
  const n=L.status==='done'?L.segTotal:LS_SEG();
  if(n<=1)return;
  startLesson(L.idx,n-1);
}
$('#lbNext').onclick=e=>{
  if(L.status==='done'){if(L.idx<LESSONS.length-1)startLesson(L.idx+1);}
  else advance();
  e.currentTarget.blur();
};
$('#lbPrev').onclick=e=>{prevBeat();e.currentTarget.blur();};
$('#lbRestart').onclick=()=>{if(L.lesson)startLesson(L.idx);};
$('#lbDemo').onclick=()=>replayDemo(DM.last);
$('#lbExit').onclick=()=>{lessonRunner.reset();demoRunner.reset();DM.last=null;updateDemoBtn();laserOff();capStrip(false);L.lesson=null;L.status='idle';updateLbar();};
document.addEventListener('keydown',e=>{
  if(!L.lesson||e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;
  if(t&&(/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(t.tagName)||t.isContentEditable))return;
  if(drawer.classList.contains('open'))return;
  if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();advance();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevBeat();}
});

$('#btnLessons').onclick=openDrawer;$('#drawerClose').onclick=closeDrawer;scrim.onclick=closeDrawer;

/* ===================================================================== 줌 · 팬 · 잉크 */
const wrap=$('#wrap'),stage=$('#stage'),inkCv=$('#ink'),ictx=inkCv.getContext('2d');
const V={z:1,tx:0,ty:0,fit:1};
function viewApply(){
  const r=wrap.getBoundingClientRect(),k=V.fit*V.z;
  V.tx=clamp(V.tx,60-1200*k,r.width-60);V.ty=clamp(V.ty,60-750*k,r.height-60);
  stage.style.transform=`translate(${V.tx}px,${V.ty}px) scale(${k})`;
}
function fitView(){
  const r=wrap.getBoundingClientRect();if(!r.width||!r.height)return;
  V.fit=Math.min(r.width/1200,r.height/750);V.z=1;
  V.tx=(r.width-1200*V.fit)/2;V.ty=(r.height-750*V.fit)/2;viewApply();
}
function zoomAt(cx,cy,f){
  const nz=clamp(V.z*f,1,6),ff=nz/V.z;if(ff===1)return;
  camUser();
  V.tx=cx-(cx-V.tx)*ff;V.ty=cy-(cy-V.ty)*ff;V.z=nz;viewApply();
}
const wrapCenter=()=>{const r=wrap.getBoundingClientRect();return [r.width/2,r.height/2];};
$('#zIn').onclick=()=>{const c=wrapCenter();zoomAt(c[0],c[1],1.4);};
$('#zOut').onclick=()=>{const c=wrapCenter();zoomAt(c[0],c[1],1/1.4);};
$('#zFit').onclick=()=>{if(CAM.raf){cancelAnimationFrame(CAM.raf);CAM.raf=0;}CAM.user=false;fitView();};
try{new ResizeObserver(()=>{if(V.z===1)fitView();else{const r=wrap.getBoundingClientRect();V.fit=Math.min(r.width/1200,r.height/750);viewApply();}}).observe(wrap);}catch(e){window.addEventListener('resize',fitView);}
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15);},{passive:false});

ictx.scale(2,2);
let strokes=[];
function drawStroke(pts,ctx){
  ctx=ctx||ictx;
  ctx.strokeStyle='#1c3f94';ctx.fillStyle='#1c3f94';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';
  if(pts.length===1){ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],1.6,0,Math.PI*2);ctx.fill();return;}
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
  const l=pts[pts.length-1];ctx.lineTo(l[0],l[1]);ctx.stroke();
}
function redrawInk(){ictx.clearRect(0,0,1200,750);strokes.forEach(st=>drawStroke(st.pts));}
function clearInk(silent){strokes=[];redrawInk();inkCv.classList.remove('absorb');inkCv.style.opacity='';}
function toLogical(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left)/r.width*1200,(e.clientY-r.top)/r.height*750];}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;let t=l2?((px-a[0])*dx+(py-a[1])*dy)/l2:0;t=clamp(t,0,1);return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy);}
function eraseAt(x,y){
  const r=10/ (V.fit*V.z)*1.0+6;let hit=false;
  strokes=strokes.filter(st=>{
    const pts=st.pts;let near=false;
    if(pts.length===1)near=Math.hypot(pts[0][0]-x,pts[0][1]-y)<r;
    else for(let i=0;i<pts.length-1&&!near;i++)if(segDist(x,y,pts[i],pts[i+1])<r)near=true;
    if(near)hit=true;return !near;
  });
  if(hit)redrawInk();
}
let tool='pen';
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function setTool(t){
  tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));
  wrap.classList.remove('t-pen','t-eraser','t-hand');wrap.classList.add('t-'+t);
}
const ptrs=new Map();let cur=null,pinch=null;
function hitTest(cx,cy){
  const els=document.elementsFromPoint(cx,cy);
  for(const el of els){const t=el.closest&&el.closest('[data-ref]');if(t&&t.dataset.ref)return {kind:'term',ref:t.dataset.ref};}
  for(const el of els){const w=el.closest&&el.closest('[data-wire]');if(w&&w.dataset.wire)return {kind:'wire',uid:+w.dataset.wire};}
  for(const el of els){const sh=el.closest&&el.closest('[data-shape]');if(sh&&sh.dataset.shape){const pe=els.find(e=>e.dataset&&e.dataset.part&&e.dataset.shape===sh.dataset.shape);return {kind:'shape',id:sh.dataset.shape,part:pe?pe.dataset.part:undefined};}}
  for(const el of els){const c=el.closest&&el.closest('[data-comp]');if(c&&c.dataset.comp)return {kind:'comp',id:c.dataset.comp};}
  return null;
}
wrap.addEventListener('pointerdown',e=>{
  if(e.button>1)return;
  try{wrap.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    if(cur&&cur.mode==='sim')simUp(cur.sim,false);
    if(cur&&cur.stroke&&cur.stroke.pts.length<8){/* 짧은 획은 버림 */redrawInk();}
    else if(cur&&cur.stroke){strokes.push(cur.stroke);}
    cur=null;
    const a=Array.from(ptrs.values()),r=wrap.getBoundingClientRect();
    pinch={d0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx:(a[0].x+a[1].x)/2-r.left,my:(a[0].y+a[1].y)/2-r.top,z0:V.z,tx0:V.tx,ty0:V.ty};
    return;
  }
  if(ptrs.size>2)return;
  const mode=e.button===1?'hand':tool;
  const pt=toLogical(e);
  if(!infoEl.hidden)closeInfo();
  cur={id:e.pointerId,mode,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),moved:0,stroke:null,len:0};
  let simTg=null;
  if(mode==='pen'&&e.button===0){const ht=hitTest(e.clientX,e.clientY);if(ht)simTg=animTarget(ht)||(SIM.on?simTarget(ht):null);}
  if(simTg){cur.mode='sim';cur.sim=simTg;simDown(simTg);}
  else if(mode==='pen'){
    cur.stroke={pts:[pt]};
    const me=cur,cx0=e.clientX,cy0=e.clientY; // 길게 누르기(500ms) = 정보 카드
    me.lp=setTimeout(()=>{if(cur===me&&me.moved<6){me.long=true;const ht=hitTest(cx0,cy0);if(ht)showInfo(ht,cx0,cy0);}},500);
  }
  else if(mode==='eraser'){eraseAt(pt[0],pt[1]);}
  else if(mode==='hand'){wrap.classList.add('dragging');}
  e.preventDefault();
});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const a=Array.from(ptrs.values()),r=wrap.getBoundingClientRect();
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,mx=(a[0].x+a[1].x)/2-r.left,my=(a[0].y+a[1].y)/2-r.top;
    camUser();
    const k0=V.fit*pinch.z0,nz=clamp(pinch.z0*d/pinch.d0,1,6),k=V.fit*nz;
    const wx=(pinch.mx-pinch.tx0)/k0,wy=(pinch.my-pinch.ty0)/k0;
    V.z=nz;V.tx=mx-wx*k;V.ty=my-wy*k;viewApply();return;
  }
  if(!cur||cur.id!==e.pointerId)return;
  const dx=e.clientX-cur.lx,dy=e.clientY-cur.ly;
  cur.moved=Math.max(cur.moved,Math.hypot(e.clientX-cur.sx,e.clientY-cur.sy));
  if(cur.mode==='hand'){camUser();V.tx+=dx;V.ty+=dy;viewApply();}
  else if(cur.mode==='pen'){
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){
      const p=toLogical(ev),pts=cur.stroke.pts,l=pts[pts.length-1];
      if(Math.hypot(p[0]-l[0],p[1]-l[1])<.8)continue;
      cur.len+=Math.hypot(p[0]-l[0],p[1]-l[1]);pts.push(p);
      ictx.strokeStyle='#1c3f94';ictx.lineWidth=2.6;ictx.lineCap='round';ictx.beginPath();ictx.moveTo(l[0],l[1]);ictx.lineTo(p[0],p[1]);ictx.stroke();
    }
  }else if(cur.mode==='eraser'){const p=toLogical(e);eraseAt(p[0],p[1]);}
  cur.lx=e.clientX;cur.ly=e.clientY;
});
function endPtr(e){
  const had=ptrs.delete(e.pointerId);
  if(pinch&&ptrs.size<2){pinch=null;if(ptrs.size===1){const o=Array.from(ptrs.keys())[0];cur=null;}return;}
  if(!had||!cur||cur.id!==e.pointerId)return;
  const c=cur;cur=null;wrap.classList.remove('dragging');clearTimeout(c.lp);
  if(c.mode==='sim'){simUp(c.sim,e.type==='pointerup'&&c.moved<10);return;}
  if(c.long){redrawInk();return;}
  const isClick=c.moved<6&&performance.now()-c.t<600&&e.type==='pointerup';
  let hit=null;
  if(isClick&&c.mode!=='eraser')hit=hitTest(e.clientX,e.clientY);
  if(c.mode==='pen'){
    if(isClick&&L.lesson&&(L.status==='play'||L.status==='wait')){redrawInk();advance();return;} // 짧은 클릭 = 다음 비트
    if(hit){redrawInk();}
    else if(c.stroke&&e.type==='pointerup'||c.stroke&&e.type==='pointercancel'){
      if(c.stroke.pts.length===1)c.stroke.pts.push([c.stroke.pts[0][0]+.1,c.stroke.pts[0][1]]);
      strokes.push(c.stroke);if(strokes.length>400)strokes.shift();
    }
  }
  if(hit)showInfo(hit,e.clientX,e.clientY);
  else if(isClick)closeInfo();
}
wrap.addEventListener('pointerup',endPtr);wrap.addEventListener('pointercancel',endPtr);
wrap.addEventListener('contextmenu',e=>{e.preventDefault();const ht=hitTest(e.clientX,e.clientY);if(ht)showInfo(ht,e.clientX,e.clientY);});

function showInfo(hit,cx,cy){
  gSel.textContent='';infoEl.textContent='';
  const body=[],ask={text:'',focus:''};
  if(hit.kind==='term'){
    const tr=findTerm(hit.ref);if(!tr)return;
    const c=tr.comp,cat=CAT[c.type];
    gSel.append(s('circle',{cx:tr.term.pts[0].x,cy:tr.term.pts[0].y,r:11,class:'selring'}));
    const desc=termDesc(c.type,tr.id,c.props);
    const ws=state.wires.filter(w=>w.from===tr.ref||w.to===tr.ref);
    body.push(h('h3',{text:(c.props.label||c.id)+' · '+cat.name}),h('div',{class:'sub',text:'단자 '+tdisp(c.type,tr.id)+'  ('+tr.ref+')'}));
    body.push(h('p',{text:desc||'(이 단자의 설명은 회사 도면/제품 매뉴얼에서 확인하세요.)'}));
    if(ws.length){
      body.push(h('p',{class:'k',text:'연결된 선'}));
      body.push(h('ul',null,ws.map(w=>{const other=w.from===tr.ref?w.to:w.from;return h('li',null,other+' ('+WC[w.color].name+(w.v?', '+w.v:'')+(w.no?', 선번호 '+w.no:'')+')'+(w.why?' — '+w.why:''));})));
    }else body.push(h('p',{class:'k',text:'아직 연결된 선이 없어요.'}));
    ask.text=(c.props.label||c.id)+'의 '+tdisp(c.type,tr.id)+' 단자('+tr.ref+')에 대해 더 설명해 주세요. 왜 거기에 연결하는지도요.';
    ask.focus='사용자가 단자 '+tr.ref+'('+cat.name+')를 눌렀다. 연결된 선: '+(ws.map(w=>w.from+'→'+w.to+' '+w.color+(w.no?' '+w.no:'')).join('; ')||'없음');
  }else if(hit.kind==='wire'){
    const w=state.wires.find(x=>x.uid===hit.uid);if(!w)return;
    gSel.append(s('path',{d:w.base.getAttribute('d'),class:'selwire'}));
    const col=WC[w.color];
    body.push(h('h3',{text:w.from+' → '+w.to}),h('div',{class:'sub',text:'선번호 '+(w.no||'없음')+' · 전압 '+(w.v||'표시 없음')}));
    body.push(h('p',null,h('span',{class:'sw',style:'background:'+col.hex}),col.name+' — '+col.mean));
    body.push(h('p',{text:w.why||'(이 선의 이유는 적혀 있지 않아요.)'}));
    ask.text=w.from+'에서 '+w.to+'로 가는 '+col.name+' 선은 왜 이렇게 연결하나요?';
    ask.focus='사용자가 선을 눌렀다: '+w.from+'→'+w.to+', 색 '+w.color+', 전압 '+(w.v||'?')+', 선번호 '+(w.no||'없음')+', 이유 '+(w.why||'없음');
  }else if(hit.kind==='shape'){

/* MAIN 전용 규칙: parts-main.js 부품 정의의 sim 속성(k=종류)으로 움직인다. 정의가 없는 부품은 영향을 받지 않는다.

   props.kind==='boundary' 는 앞 강의에서 이미 만든 공급을 대본이 명시한 경계조건으로 쓴다. */
const MAIN_SIM={};
Object.keys(CAT).forEach(t=>{const sm=CAT[t].sim;if(sm&&sm.k){MAIN_SIM[t]=sm;if(['brk','mc','sw'].includes(sm.k)||sm.click)SIM_CLK.add(t);}});
const mainPairs=(L,list)=>(list||[]).forEach(p=>L.push([p[0],p[1]]));
function mainSimLinks(c,S,d){

    case 'sw':mainPairs(L,S.pressed?m.on:m.off);break;

    case 'sfc':if(d['c:'+id]){L.push(['13','14']);L.push(['23','24']);}break;
    case 'drv':if(d['p:'+id]){L.push(S.fault?['MA','MC']:['MB','MC']);if(d['r:'+id])L.push(['M1','M2']);if(d['z:'+id])L.push(['M3','M4']);if(d['e:'+id])L.push(['M5','M6']);}break;
  }
  return L;
}
function mainSimSources(c,d,noneW,add){
  const m=MAIN_SIM[c.type],S=simSt(c.id),b=c.props.kind,id=c.id;

    case 'rail':if(b==='boundary'&&m.bnd&&!S.off){

      if(m.bnd==='+')add(t0,'dc:PS1','+');else if(m.bnd==='-')add(t0,'dc:PS1','-');else add(t0,'ac:SUP',m.bnd);}break;
    case 'thru':if(m.fld&&S.forced)add('2','dc:PS1','+');break;
    case 'smps':if(d['p:'+id]){m.plus.forEach(t=>add(t,'dc:PS1','+'));m.minus.forEach(t=>add(t,'dc:PS1','-'));}break;
    case 'tr':if(d['p:'+id]||(b==='boundary'&&!S.off)){add(m.out[0],'ac2:'+id,'S1');add(m.out[1],'ac2:'+id,'S2');}break;
    case 'sfc':if(b==='boundary'&&d['c:'+id]){add('13','dc:PS1','+');add('23','dc:PS1','+');}break;
    case 'drv':if(d['r:'+id]){add('U/T1','inv:'+id,'U');add('V/T2','inv:'+id,'V');add('W/T3','inv:'+id,'W');}break;
    case 'outs':for(const t in S.o||{})if(S.o[t])add(t,'dc:PS1','-');break;

}
function mainSimWant(c,X,noneW,d){
  const m=MAIN_SIM[c.type],S=simSt(c.id),id=c.id,b=c.props.kind,w={},r=t=>id+'.'+t;
  const dcPair=(a,z)=>X.pairs(r(a),r(z)).some(p=>p[0].grp.startsWith('dc:'));
  switch(m.k){
    case 'mc':w['c:'+id]=dcPair(m.coil[0],m.coil[1]);break;
    case 'smps':w['p:'+id]=X.pairs(r(m.inp[0]),r(m.inp[1])).some(p=>p[0].grp.startsWith('ac'));break;
    case 'tr':w['p:'+id]=X.pairs(r(m.inp[0]),r(m.inp[1])).length>0;break;
    case 'sfc':{
      if(b==='boundary'){w['c:'+id]=!S.forced;break;}
      const ok=dcPair('A1','A2')&&X.same(r('M11'),r('M12'))&&X.same(r('M21'),r('M22'));
      const rst=X.pol(r('M51')).some(x=>x.pole==='+'&&x.grp.startsWith('dc:'));
      w['c:'+id]=!!(ok&&(d['c:'+id]||rst));break;}
    case 'drv':{
      const p=b==='boundary'||!!X.tri(r('R/L1'),r('S/L2'),r('T/L3'));
      const low=t=>X.pol(r(t)).some(x=>x.pole==='-'&&x.grp.startsWith('dc:')),high=t=>X.pol(r(t)).some(x=>x.pole==='+'&&x.grp.startsWith('dc:'));
      const sto=noneW(c,['H1','H2'])||(high('H1')&&high('H2'));
      const f=low('S1'),rv=low('S2');
      const run=p&&sto&&!S.fault&&!(f&&rv)&&(f||rv||(m.mode!=='fault'&&!!S.forced));
      w['p:'+id]=p;w['r:'+id]=run?1:0;w['z:'+id]=p&&!run;w['e:'+id]=p&&!sto;break;}
  }
  return w;
}
function mainSimResult(c,X,d,res,two,thr){
  const m=MAIN_SIM[c.type],id=c.id,S=simSt(id);
  switch(m.k){
    case 'mc':two(c,'coil',m.coil[0],m.coil[1]);if(d['c:'+id])res.coilOn.add(id);res.snap['c:'+id]=!!(d['c:'+id]||S.forced);break;
    case 'smps':case 'tr':if(d['p:'+id])two(c,'supply',m.inp[0],m.inp[1]);break;

function mainSimGet(c){

/* ----- 부품 내부 링크 (현재 상태에서 닫힌 단자 쌍) ----- */
function simLinks(c,S,d){
  const id=c.id,L=[],P=(a,b)=>L.push([a,b]);
  if(MAIN_SIM[c.type])return mainSimLinks(c,S,d);
  switch(c.type){
    case 'MCCB':case 'ELB':if(!S.open){P('L1','T1');P('L2','T2');P('L3','T3');}break;
    case 'CP':if(!S.open){P('1','2');P('3','4');}break;
    case 'MC':if(d['c:'+id]||S.forced){P('L1','T1');P('L2','T2');P('L3','T3');P('13','14');}else P('21','22');break;
    case 'THR':P('L1','T1');P('L2','T2');P('L3','T3');if(S.trip)P('97','98');else P('95','96');break;
    case 'RY':if(d['c:'+id]||S.forced){P('11','14');P('21','24');}else{P('11','12');P('21','22');}break;
    case 'RELAY14':if(d['c:'+id]||S.forced){P('9','1');P('10','2');}else{P('9','5');P('10','6');}break;
    case 'TIMER':if(d['t:'+id]){P('1','3');P('8','6');}else{P('1','4');P('8','5');}break;
    case 'PB':if(S.pressed)P('13','14');else P('11','12');break;
    case 'ESTOP':if(!S.pressed){P('11','12');P('21','22');}break;
    case 'SS':if(S.pos)P('23','24');else P('13','14');break;
    case 'SW':if(S.closed)P('1','2');break;
    case 'LS':if(S.act)P('C','NO');else P('C','NC');break;
    case 'LIMIT2':if(S.act)P('NO1','NO2');else P('NC1','NC2');break;
    case 'SENSOR':case 'SENSOR4':if(d['sp:'+id]&&S.detect){if(c.type==='SENSOR'&&c.props.kind==='PNP')P('BK','BN');else P('BK','BU');}break;
    case 'E3JK':if(d['sp:'+id]&&S.detect)P('WH','BK');else P('WH','GY');break;
    case 'PLC_OUT':for(const k in (S.o||{}))if(S.o[k]&&/^Y[0-7]$/.test(k))P(+k.slice(1)<4?'COM1':'COM2',k);break;
    case 'XGB_OUT':for(const k in (S.o||{}))if(S.o[k]&&/^P2[0-7]$/.test(k))P(k,'COM');break;
    case 'GA500':if(S.fault)P('MA','MC');else P('MB','MC');break;
    case 'INV':if(S.fault)P('30A','30C');else P('30B','30C');break;
  }
  return L;
}
/* ----- 전원(소스) ----- */
function simSources(comps,dyn,noneW){
  const a=[];
  for(const c of comps){
    const id=c.id,S=simSt(id),t=c.type;
    const add=(tid,grp,pole)=>{if(c.terms[tid])a.push({ref:id+'.'+tid,grp,pole});};
    if(MAIN_SIM[t]){mainSimSources(c,dyn,noneW,add);continue;}
    if(t==='PWR'){if(!S.off)['R','S','T','N'].forEach(k=>add(k,'ac:'+id,k));}
    else if(t==='BATT'){add('+','dc:'+id,'+');add('-','dc:'+id,'-');}
    else if(t==='SMPS'){if(dyn['p:'+id]){add('+V','dc:'+id,'+');add('-V','dc:'+id,'-');}}
    else if(t==='TR'){if(dyn['p:'+id]){add('S1','ac2:'+id,'S1');add('S2','ac2:'+id,'S2');}}
    else if(t==='MCCB'||t==='ELB'){if(noneW(c,['L1','L2','L3'])){add('L1','ac:'+id,'R');add('L2','ac:'+id,'S');add('L3','ac:'+id,'T');}}
    else if(t==='CP'){if(noneW(c,['1','3'])){add('1','ac:'+id,'L');add('3','ac:'+id,'N');}}
    else if(t==='GA500'||t==='INV'){const d=dyn['r:'+id];if(d){add('U','inv:'+id,'U');add('V','inv:'+id,d===1?'V':'W');add('W','inv:'+id,d===1?'W':'V');}}
  }
  return a;
}
/* ----- 네트 구성 (union-find) ----- */
function simNet(comps,dyn,idx,N,noneW){
  const par=new Int32Array(N);for(let i=0;i<N;i++)par[i]=i;
  const find=a=>{while(par[a]!==a){par[a]=par[par[a]];a=par[a];}return a;};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par[a]=b;};
  state.wires.forEach(w=>{const a=idx.get(w.from),b=idx.get(w.to);if(a!=null&&b!=null)uni(a,b);});
  const lk=[];
  comps.forEach(c=>simLinks(c,simSt(c.id),dyn).forEach(p=>{const ra=c.id+'.'+p[0],rb=c.id+'.'+p[1],ia=idx.get(ra),ib=idx.get(rb);if(ia!=null&&ib!=null){uni(ia,ib);lk.push({c,a:ra,b:rb});}}));
  const R_=r=>{const i=idx.get(r);return i==null?-1:find(i);};
  const src=simSources(comps,dyn,noneW);
  const np=new Map();
  src.forEach(sr=>{const r=R_(sr.ref);if(r<0)return;let a=np.get(r);if(!a){a=[];np.set(r,a);}if(!a.some(x=>x.grp===sr.grp&&x.pole===sr.pole))a.push({grp:sr.grp,pole:sr.pole});});
  const deadG=new Set(),shortRoots=new Set();
  np.forEach((a,r)=>{const by={};a.forEach(x=>{(by[x.grp]=by[x.grp]||new Set()).add(x.pole);});for(const g in by)if(by[g].size>1){deadG.add(g);shortRoots.add(r);}});
  if(deadG.size)np.forEach((a,r)=>np.set(r,a.filter(x=>!deadG.has(x.grp))));
  const pol=ref=>{const r=R_(ref);return r<0?[]:(np.get(r)||[]);};
  const same=(a,b)=>{const x=R_(a);return x>=0&&x===R_(b);};
  const tri=(a,b,c)=>{
    for(const x of pol(a)){if(SIM_ORD[x.pole]==null)continue;
      for(const y of pol(b)){if(y.grp!==x.grp||SIM_ORD[y.pole]==null||y.pole===x.pole)continue;
        for(const z of pol(c)){if(z.grp===x.grp&&SIM_ORD[z.pole]!=null&&z.pole!==x.pole&&z.pole!==y.pole)return [x,y,z];}}}
    return null;
  };
  const pairs=(a,b)=>{const o=[];pol(a).forEach(x=>pol(b).forEach(y=>{if(y.grp===x.grp&&y.pole!==x.pole)o.push([x,y]);}));return o;};
  return {R_,np,lk,src:src.filter(x=>!deadG.has(x.grp)),deadG,shortRoots,pol,same,tri,pairs};
}
/* ----- 코일/전원/구동 판정 ----- */
function simWant(comps,X,noneW,dyn){
  const w={};
  for(const c of comps){
    const id=c.id,S=simSt(id),r=t=>id+'.'+t;
    if(MAIN_SIM[c.type]){Object.assign(w,mainSimWant(c,X,noneW,dyn));continue;}
    switch(c.type){
      case 'MC':case 'RY':w['c:'+id]=X.pairs(r('A1'),r('A2')).length>0;break;
      case 'RELAY14':w['c:'+id]=X.pairs(r('14'),r('13')).length>0;break;
      case 'TIMER':w['c:'+id]=X.pairs(r('2'),r('7')).length>0;w['t:'+id]=!!(S.tdone&&w['c:'+id]);break;
      case 'SMPS':w['p:'+id]=noneW(c,['L','N'])?true:X.pairs(r('L'),r('N')).length>0;break;
      case 'TR':w['p:'+id]=noneW(c,['P1','P2'])?true:X.pairs(r('P1'),r('P2')).length>0;break;
      case 'SENSOR':case 'SENSOR4':w['sp:'+id]=X.pol(r('BN')).some(x=>x.pole==='+'&&X.pol(r('BU')).some(y=>y.grp===x.grp&&y.pole==='-'));break;
      case 'E3JK':w['sp:'+id]=X.pairs(r('BN'),r('BU')).length>0;break;
      case 'GA500':case 'INV':{
        const g5=c.type==='GA500',p=noneW(c,['R','S','T'])?true:!!X.tri(r('R'),r('S'),r('T'));
        w['p:'+id]=p;
        const f=p&&!S.fault&&X.same(r(g5?'S1':'P1'),r(g5?'SN':'CM')),rv=p&&!S.fault&&X.same(r(g5?'S2':'P2'),r(g5?'SN':'CM'));
        w['r:'+id]=(f&&rv)?0:f?1:rv?2:0;
        break;}
    }
  }
  return w;
}

/* ----- 풀이 ----- */
function simSolve(opt){
  if(!SIM.on)return;
  opt=opt||{};
  const comps=Object.values(state.components);
  const refs=[],idx=new Map();
  comps.forEach(c=>{for(const t in c.terms){idx.set(c.id+'.'+t,refs.length);refs.push(c.id+'.'+t);}});
  const N=refs.length;
  const wired=new Set();state.wires.forEach(w=>{wired.add(w.from);wired.add(w.to);});
  const noneW=(c,list)=>list.every(t=>!wired.has(c.id+'.'+t));
  for(const k in SIM.st)if(!state.components[k])delete SIM.st[k];
  const dyn={};for(const k in SIM.dyn)if(state.components[k.slice(k.indexOf(':')+1)])dyn[k]=SIM.dyn[k];
  let X=null,stable=false;
  for(let it=0;it<40&&!stable;it++){
    X=simNet(comps,dyn,idx,N,noneW);
    const want=simWant(comps,X,noneW,dyn);
    let coilDone=false,diff=false;
    for(const k in want){
      if((dyn[k]||0)===(want[k]||0))continue;
      if(k.charAt(0)==='c'&&k.charAt(1)===':'){if(coilDone)continue;coilDone=true;}
      dyn[k]=want[k];diff=true;
    }
    if(!diff)stable=true;
  }
  SIM.dyn=dyn;
  const res=simResult(X,comps,dyn,idx,wired);
  res.chatter=!stable;
  SIM.res=res;
  // 타이머
  let pending=false;
  comps.forEach(c=>{
    if(c.type!=='TIMER')return;
    const S=simSt(c.id);
    if(dyn['c:'+c.id]){
      if(!S.tdone&&!S.tid){S.t0=performance.now();S.tdur=SIM_TIMER_MS/speed;S.tid=setTimeout(()=>{S.tid=0;S.tdone=true;simSolve();},S.tdur);}
    }else{if(S.tid){clearTimeout(S.tid);S.tid=0;}S.tdone=false;}
    if(S.tid)pending=true;
  });
  if(pending&&!SIM.tick)SIM.tick=setInterval(simTickTimers,100);
  else if(!pending&&SIM.tick){clearInterval(SIM.tick);SIM.tick=0;}
  simRender();
  simDiffPops(res,opt.quiet);
  simHintNew();
}
/* 강의 중 클릭할 수 있는 부품이 처음 나오면 "👆 눌러 보세요" 1회 */
function simHintNew(){
  if(!L.lesson||lessonRunner.fast||DM.busy)return;
  for(const c of Object.values(state.components)){
    if(!SIM_CLK.has(c.type)||SIM.hinted.has(c.type))continue;
    SIM.hinted.add(c.type);
    setTimeout(()=>{if(state.components[c.id]&&!lessonRunner.fast&&!DM.busy)simPopAt(c.id,'👆 눌러 보세요');},1100);
    break;
  }
}
function simTickTimers(){

/* ----- 결과(부하 ON/OFF, 흐름 선, 전압 선) ----- */
function simResult(X,comps,dyn,idx,wired){
  const res={loads:[],flowW:new Map(),flowL:[],live:[],shortW:[],lampOn:new Set(),motor:{},inOn:new Set(),inv:{},snap:{},coilOn:new Set()};
  const two=(c,kind,a,b,o)=>{
    const A=c.id+'.'+a,B=c.id+'.'+b;
    let ps=X.pairs(A,B);if(o&&o.dc)ps=ps.filter(p=>p[0].grp.slice(0,3)==='dc:');
    const L={c,kind,refs:[A,B],on:ps.length>0,ps:ps[0]||null,tid:o&&o.tid};
    res.loads.push(L);return L;
  };
  const thr=(c,kind,a,b,d)=>{
    const t=X.tri(c.id+'.'+a,c.id+'.'+b,c.id+'.'+d);
    const L={c,kind,refs:[c.id+'.'+a,c.id+'.'+b,c.id+'.'+d],on:!!t,tri:t};
    res.loads.push(L);return L;
  };
  const wiredAny=(c,l)=>l.some(t=>wired.has(c.id+'.'+t));
  for(const c of comps){
    const id=c.id,S=simSt(id),t=c.type;
    if(MAIN_SIM[t]){mainSimResult(c,X,dyn,res,two,thr);continue;}
    switch(t){
      case 'MC':case 'RY':two(c,'coil','A1','A2');break;
      case 'RELAY14':two(c,'coil','14','13');break;
      case 'TIMER':two(c,'coil','2','7');break;
      case 'LAMP':{const L=two(c,'lamp','X1','X2');if(L.on)res.lampOn.add(id);res.snap['lamp:'+id]=L.on;break;}
      case 'RES':{const L=two(c,'res','1','2');if(L.on)res.lampOn.add(id);break;}
      case 'MOTOR':case 'MOTOR6':{
        const k=t==='MOTOR'?['U','V','W']:['U1','V1','W1'];
        const L=thr(c,'motor',k[0],k[1],k[2]);
        let dir=0;if(L.on){dir=((SIM_ORD[L.tri[1].pole]-SIM_ORD[L.tri[0].pole]+3)%3===1)?1:2;}
        res.motor[id]=dir;res.snap['mot:'+id]=dir;break;}
      case 'PLC_IN':case 'XGB_IN':
        for(const tid in c.terms){if(tid==='COM')continue;
          const L=two(c,'in',tid,'COM',{dc:true,tid});if(L.on)res.inOn.add(id+'.'+tid);res.snap['in:'+id+'.'+tid]=L.on;}
        break;
      case 'SMPS':if(dyn['p:'+id]&&wiredAny(c,['L','N']))two(c,'supply','L','N');break;
      case 'TR':if(dyn['p:'+id]&&wiredAny(c,['P1','P2']))two(c,'supply','P1','P2');break;
      case 'SENSOR':case 'SENSOR4':case 'E3JK':if(dyn['sp:'+id])two(c,'supply','BN','BU');break;
      case 'GA500':case 'INV':{
        const g5=t==='GA500';
        if(dyn['p:'+id]&&wiredAny(c,['R','S','T']))thr(c,'supply','R','S','T');
        const run=dyn['r:'+id]||0;
        const both=!!dyn['p:'+id]&&!S.fault&&X.same(id+'.'+(g5?'S1':'P1'),id+'.'+(g5?'SN':'CM'))&&X.same(id+'.'+(g5?'S2':'P2'),id+'.'+(g5?'SN':'CM'));
        const st=S.fault?'FAULT':run===1?'FWD':run===2?'REV':'STOP';
        res.inv[id]={st,both,pwr:!!dyn['p:'+id]};res.snap['inv:'+id]=st+(both?'!':'');
        break;}
      case 'THR':res.snap['trip:'+id]=!!S.trip;break;
    }
    if(dyn['c:'+id])res.coilOn.add(id);
    if(t==='MC'||t==='RY'||t==='RELAY14'||t==='TIMER')res.snap['c:'+id]=!!dyn['c:'+id];
    if(t==='TIMER')res.snap['t:'+id]=!!dyn['t:'+id];
    if(S.o)for(const k in S.o)res.snap['out:'+id+'.'+k]=!!S.o[k];
  }
  // 흐름: 그래프
  const adj=new Map();
  const addE=(a,b,e)=>{(adj.get(a)||adj.set(a,[]).get(a)).push({to:b,e});(adj.get(b)||adj.set(b,[]).get(b)).push({to:a,e});};
  state.wires.forEach(w=>{if(idx.has(w.from)&&idx.has(w.to)&&w.from!==w.to)addE(w.from,w.to,{w});});
  X.lk.forEach(l=>addE(l.a,l.b,{l}));
  const srcAt=new Map();X.src.forEach(s0=>{(srcAt.get(s0.ref)||srcAt.set(s0.ref,[]).get(s0.ref)).push(s0);});
  const side=(start,grp,pole,toward)=>{
    const comp=new Set([start]),q=[start];
    for(let i=0;i<q.length;i++)for(const e of adj.get(q[i])||[])if(!comp.has(e.to)){comp.add(e.to);q.push(e.to);}
    const keep=new Set([start]);
    comp.forEach(r=>{if((srcAt.get(r)||[]).some(x=>x.grp===grp&&x.pole===pole))keep.add(r);});
    if(keep.size<2)return;
    let edges=[];
    comp.forEach(a=>{for(const e of adj.get(a)||[])if(a<e.to)edges.push({a,b:e.to,e:e.e});});
    const deg=new Map();edges.forEach(x=>{deg.set(x.a,(deg.get(x.a)||0)+1);deg.set(x.b,(deg.get(x.b)||0)+1);});
    for(let ch=true;ch;){ch=false;edges=edges.filter(x=>{
      if((deg.get(x.a)===1&&!keep.has(x.a))||(deg.get(x.b)===1&&!keep.has(x.b))){deg.set(x.a,deg.get(x.a)-1);deg.set(x.b,deg.get(x.b)-1);ch=true;return false;}
      return true;});}
    const ad=new Map();edges.forEach(x=>{(ad.get(x.a)||ad.set(x.a,[]).get(x.a)).push(x.b);(ad.get(x.b)||ad.set(x.b,[]).get(x.b)).push(x.a);});
    const dist=new Map([[start,0]]),q2=[start];
    for(let i=0;i<q2.length;i++)for(const n of ad.get(q2[i])||[])if(!dist.has(n)){dist.set(n,dist.get(q2[i])+1);q2.push(n);}
    edges.forEach(x=>{
      const da=dist.get(x.a),db=dist.get(x.b);if(da==null||db==null)return;
      const far=da>=db?x.a:x.b,near=far===x.a?x.b:x.a;
      const f=toward?far:near,tt=toward?near:far;
      if(x.e.w){const w=x.e.w;if(!res.flowW.has(w))res.flowW.set(w,f===w.from?1:-1);}
      else if(x.e.l){const key=x.e.l;if(!res.flowL.some(o=>o.l===key))res.flowL.push({l:key,from:f,to:tt});}
    });
  };
  const rank=p=>SIM_RANK[p]==null?5:SIM_RANK[p];
  res.loads.forEach(L=>{
    if(!L.on)return;
    if(L.tri){L.tri.forEach((p,i)=>side(L.refs[i],p.grp,p.pole,true));}
    else if(L.ps){
      const a=L.ps[0],b=L.ps[1],hotA=rank(a.pole)<=rank(b.pole);
      side(L.refs[0],a.grp,a.pole,hotA);side(L.refs[1],b.grp,b.pole,!hotA);
    }
  });
  // 전압만 있는 선 / 단락 선
  state.wires.forEach(w=>{
    const r=X.R_(w.from);if(r<0)return;
    if(X.shortRoots.has(r))res.shortW.push(w);
    else if(!res.flowW.has(w)&&(X.np.get(r)||[]).length)res.live.push(w);
  });
  res.snap.short=res.shortW.length>0;
  return res;
}

function simPopXY(x,y,text){
  SIM.popQ.push({x,y,text});

}
function simPopNext(){
  SIM.popTm=0;const p=SIM.popQ.shift();if(!p)return;
  simPopShow(p.x,p.y,p.text);

}
function simPopShow(x,y,text){
  const g=s('g',{class:'sim-pop'}),t=s('text',{x:0,y:0,class:'sim-pt'},text);
  gSimPop.append(g);g.append(t);
  let wd=text.length*13,hh=26;try{const bb=t.getBBox();if(bb.width>0){wd=bb.width;hh=bb.height;}}catch(e){}
  const w=wd+18,h=hh+6;
  let px=clamp(x,8,1192-w),py=clamp(y,62,744-h);
  for(let k=0;k<8;k++){
    const hit=SIM.popBoxes.some(b=>px<b.x+b.w+4&&px+w+4>b.x&&py<b.y+b.h+2&&py+h+2>b.y);
    if(!hit)break;py+=h+3;if(py+h>744)py=clamp(y,62,744-h)-(k+1)*(h+3);
  }
  const box={x:px,y:py,w,h};SIM.popBoxes.push(box);
  const rc=s('rect',{x:px,y:py,width:w,height:h,rx:9,class:'sim-pb'});
  g.insertBefore(rc,t);
  t.setAttribute('x',px+9);t.setAttribute('y',py+h-9);
  const life=1600/Math.max(.5,speed);
  setTimeout(()=>{g.style.opacity=0;},life);
  setTimeout(()=>{g.remove();const i=SIM.popBoxes.indexOf(box);if(i>=0)SIM.popBoxes.splice(i,1);},life+320);
}
function simPopAt(at,text){

function simDiffPops(res,quiet){
  const prev=SIM.prev;SIM.prev=res.snap;
  if(!prev)return;
  const sn=res.snap;
  for(const k in sn){
    const v=sn[k],o=prev[k];if(o===v||(o==null&&!v))continue;
    const i=k.indexOf(':'),kind=i<0?k:k.slice(0,i),ref=i<0?'':k.slice(i+1),cid=ref.split('.')[0],lb=simLbl(cid);

      case 't':if(v)txt=lb+' 시간 됐다!';at=ref;break;
      case 'lamp':txt=lb+' 램프 '+(v?'ON':'OFF');break;
      case 'mot':txt=v===1?'모터 정회전':v===2?'모터 역회전':'모터 정지';break;

      case 'out':txt='출력 '+ref.split('.')[1]+(v?' ON':' OFF');break;
      case 'trip':txt=v?'트립!':'트립 리셋';break;
      case 'inv':txt=String(v).slice(-1)==='!'?'정/역 동시 입력!':v==='FWD'?'정회전 지령':v==='REV'?'역회전 지령':v==='FAULT'?'인버터 고장!':'인버터 정지';break;
      case 'short':if(v&&res.shortW.length){const w=res.shortW[0],p=w.pts[Math.floor(w.pts.length/2)];simPopXY(p[0]+8,p[1]-30,'단락!');}break;

  else if(!res.chatter)SIM.chatSig='';

/* ----- 클릭 / 누름 ----- */
function simTarget(hit){
  if(hit.kind==='comp'){const c=state.components[hit.id];return c&&SIM_CLK.has(c.type)?{comp:c}:null;}
  if(hit.kind==='term'){const tr=findTerm(hit.ref);if(tr&&simOutTerm(tr.comp,tr.id))return {comp:tr.comp,tid:tr.id};}
  return null;
}
/* 현재 값(눌림/켬)을 읽고 쓰는 방법 — 켬형(PWR·차단기·SW)은 true=켬(닫힘), 나머지는 true=작동(눌림·트립·감지·고장·강제) */
function simGet(tg){
  const S=simSt(tg.comp.id),t=tg.comp.type;
  if(tg.tid)return !!(S.o&&S.o[tg.tid]);
  if(MAIN_SIM[t])return mainSimGet(tg.comp);
  switch(t){
    case 'PWR':return !S.off;
    case 'MCCB':case 'ELB':case 'CP':return !S.open;
    case 'SW':return !!S.closed;
    case 'THR':return !!S.trip;
    case 'PB':case 'ESTOP':return !!S.pressed;
    case 'SS':return !!S.pos;
    case 'LS':case 'LIMIT2':return !!S.act;
    case 'SENSOR':case 'SENSOR4':case 'E3JK':return !!S.detect;
    case 'GA500':case 'INV':return !!S.fault;
    default:return !!S.forced;
  }
}
function simSet(tg,v){
  const S=simSt(tg.comp.id),t=tg.comp.type;
  if(tg.tid){(S.o||(S.o={}))[tg.tid]=v;return;}
  if(MAIN_SIM[t]){mainSimSet(tg.comp,v);return;}
  switch(t){
    case 'PWR':S.off=!v;break;
    case 'MCCB':case 'ELB':case 'CP':S.open=!v;break;
    case 'SW':S.closed=v;break;
    case 'THR':S.trip=v;break;
    case 'PB':case 'ESTOP':S.pressed=v;break;
    case 'SS':S.pos=v?1:0;break;
    case 'LS':case 'LIMIT2':S.act=v;break;
    case 'SENSOR':case 'SENSOR4':case 'E3JK':S.detect=v;break;
    case 'GA500':case 'INV':S.fault=v;break;
    default:S.forced=v;
  }
}
function simApply(tg,what){
  if(!tg)return;
  SIM.used.add(tg.comp.id);
  const v=(what==='press'||what==='on')?true:(what==='release'||what==='off')?false:!simGet(tg);
  simSet(tg,v);simSolve();
}
function simDown(tg){
  if(tg.anim){tg.anim.click(tg.part);return;}
  SIM.used.add(tg.comp.id);
  if((tg.comp.type==='PB'||(MAIN_SIM[tg.comp.type]&&MAIN_SIM[tg.comp.type].momentary))&&!tg.tid){simSet(tg,true);simSolve();}
  else simApply(tg,'toggle');
}
function simUp(tg,click){
  if(tg.anim)return;
  if((tg.comp.type==='PB'||(MAIN_SIM[tg.comp.type]&&MAIN_SIM[tg.comp.type].momentary))&&!tg.tid){simSet(tg,false);simSolve();}
}

/* id → 대상. 'XGBO.P24' 같은 출력 단자 ref 도 허용 */
function simResolve(id){
  if(typeof id!=='string')return null;
  const tr=findTerm(id);
  if(tr){if(simOutTerm(tr.comp,tr.id))return {comp:tr.comp,tid:tr.id};return SIM_CLK.has(tr.comp.type)?{comp:tr.comp}:null;}
  const c=findComp(id.trim());

}

const DM={busy:null,last:null,seq:0};
function dwait(R,ms){ // R.sleep과 같지만 reduced-motion에서도 시간을 둔다(원인-결과를 보려면 시간이 필요)
  const tok=R.tok,d=R.fast?0:ms/speed;
  return new Promise((res,rej)=>{
    if(d<=0){tok===R.tok?res():rej(CANCEL);return;}
    const o={};
    o.t=setTimeout(()=>{R.sleeps.delete(o);tok===R.tok?res():rej(CANCEL);},d);
    o.fin=()=>{clearTimeout(o.t);R.sleeps.delete(o);tok===R.tok?res():rej(CANCEL);};
    R.sleeps.add(o);
  });
}
function hideFinger(now){fingerEl.style.opacity=0;if(now)fingerEl.style.transition='none';}
async function moveFinger(x,y,R){
  const first=fingerEl.style.opacity!=='1';
  if(first){fingerEl.style.transition='none';fingerEl.style.transform='translate('+(x+70)+'px,'+(y+70)+'px)';void fingerEl.offsetWidth;}
  const ms=R.fast?0:500/speed;
  fingerEl.style.transition=ms>0?'transform '+ms+'ms ease-in-out, opacity .2s':'opacity .2s';
  fingerEl.style.opacity=1;fingerEl.style.transform='translate('+x+'px,'+y+'px)';
  await dwait(R,520);
}
function fingerTap(){fingerEl.classList.add('tap');setTimeout(()=>fingerEl.classList.remove('tap'),180);}
function demoPoint(tg){
  if(tg.tid){const p=tg.comp.terms[tg.tid].pts[0];return {x:p.x,y:p.y};}
  return {x:tg.comp.x,y:tg.comp.y};
}
async function demoStep(so,R,turn){
  if(!so||typeof so!=='object')return;
  switch(so.t){
    case 'act':{
      const an=animResolve(so.id);
      if(an){ // anim 위젯 (level / pipe / cover / toggle…)
        if(!R.fast){const p=an.fingerAt(so.do);await moveFinger(p.x,p.y,R);fingerTap();await dwait(R,150);}
        an.act(String(so.do||'toggle'),so.value);
        await dwait(R,900);break;}
      const tg=simResolve(so.id);
      if(!tg){console.warn('demo act: 대상 없음',so.id);return;}
      if(!R.fast){const p=demoPoint(tg);await moveFinger(p.x,p.y,R);fingerTap();await dwait(R,150);}
      simApply(tg,String(so.do||'toggle'));
      await dwait(R,700);break;}
    case 'pop':simPopAt(so.at,so.text);await dwait(R,350);break;
    case 'wait':await dwait(R,Math.max(0,Math.min(10000,+so.ms||0)));break;
    case 'say':await opSay(so,R,turn);break;
    case 'reset':simResetState();simSolve({quiet:true});await dwait(R,200);break;
  }
}
function demoValid(rec){
  if(!rec)return false;
  return rec.ops.every(o=>!o||o.t!=='act'||simResolve(o.id));
}
function addDemoChip(rec,turn){
  const btn=h('button',{class:'pbtn',onclick:()=>replayDemo(rec)},'▶ 다시 보기: '+rec.title);
  const row=h('div',{class:'demo-chip'},btn);
  margin.append(row);if(turn)turn.notes.push(row);scrollMargin();
}
async function playDemo(op,R,turn){
  const ops=Array.isArray(op.ops)?op.ops:[];
  const rec={title:String(op.title||'동작 보기').slice(0,30),ops,scene:op.replay?(op.scene||[]):SCENE.slice()};
  if(R.fast){ // 바로 완성/이어보기 중에는 재생하지 않고 칩만
    if(!op.replay){DM.last=rec;addDemoChip(rec,turn);updateDemoBtn();}
    return;
  }
  const my=++DM.seq;DM.busy={R,my};updateDemoBtn();
  let done=false;
  try{
    simEnable(true,true);simResetState();simSolve({quiet:true});
    gSimHint.textContent='';
    for(const so of ops)await demoStep(so,R,turn);
    done=true;
  }finally{
    if(DM.busy&&DM.busy.my===my){DM.busy=null;setTimeout(()=>{if(!DM.busy)hideFinger();},500);updateDemoBtn();}
  }
  if(done){
    simSetHint('이제 직접 눌러 보세요');
    DM.last=rec;if(!op.replay)addDemoChip(rec,turn);
    updateDemoBtn();
  }
}
function replayDemo(rec){
  if(!rec)return;
  if(DM.busy&&DM.busy.R!==demoRunner)return;
  if(!demoValid(rec)){
    const idle=!L.lesson||L.status==='done';

    // 강의가 끝난 뒤에는 그 장면의 부품·전선을 빠르게 다시 그린 뒤 재생한다
    demoRunner.reset();lessonRunner.flush();

    return;
  }
  demoRunner.reset();
  demoRunner.push([{t:'demo',title:rec.title,ops:rec.ops,replay:true,scene:rec.scene}],null);
}

  progress.setAttribute('aria-hidden', 'true');
  toggle.append(label, progress);
  const panel = document.createElement('div');
  panel.id = 'mobileControlsPanel';
  panel.append(dock, lessonBar);
  controls.append(toggle, panel);
  app.append(controls);
  let open = false;
  try { open = localStorage.getItem(key) === '1'; } catch (_) {}
  function render(save) {
    panel.hidden = !open;
    document.documentElement.classList.toggle('study-tools-collapsed', !open);
    toggle.setAttribute('aria-expanded', String(open));
    label.textContent = open ? '학습 도구 접기 ▾' : '학습 도구 열기 ▴';
    toggle.setAttribute('aria-label', open ? '학습 도구 접기' : '학습 도구 열기');
    if (save) { try { localStorage.setItem(key, open ? '1' : '0'); } catch (_) {} }
    requestAnimationFrame(() => window.__diary?.fitView());
  }
  function updateProgress() {
    const step = document.getElementById('lbStep').textContent;
    progress.textContent = lessonBar.hidden ? '강의 목록에서 시작하세요' : step + (open ? '' : ' · 설명을 눌러 다음');
  }
  toggle.addEventListener('click', () => { open = !open; render(true); });
  new MutationObserver(updateProgress).observe(lessonBar, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:['hidden']});
  render(false);
  updateProgress();
})();
</script>
</body></html>
