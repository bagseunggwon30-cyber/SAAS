<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>결선 일기장 · 모바일 학습</title>
<meta name="claude:viewport-fit-sides" content="cover">



<style>
:root{
  /* chrome (책상·툴바) */
  --desk:#cdc8b8; --bar:#f1eee4; --card:#fbf9f1; --ui-ink:#23262b; --ui-dim:#5b626a; --line:#b9b4a3;
  --accent:#1c3f94; --accent-ink:#ffffff; --danger:#b3261e; --ok:#2f7d4a; --warn:#b7791f; --scrim:rgba(20,20,20,.42);
  /* paper & ink (종이는 종이라서 테마와 무관하게 고정) */
  --paper:#f6f1e1; --grid:rgba(70,112,128,.14); --margin-line:rgba(186,58,48,.55);
  --ink-user:#1c3f94; --ink-ai:#2a1c15; --ink-boss:#c2271d; --pencil:#4b4f56; --hi:#0c6b5c;
  --f-ai:'Nanum Pen Script','Gaegu','Segoe Print','Malgun Gothic',cursive;
  --f-user:'Gaegu','Nanum Pen Script','Segoe Print','Malgun Gothic',cursive;
  --f-boss:'Nanum Brush Script','Nanum Pen Script','Malgun Gothic',cursive;
  --f-ui:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --pl:max(16px,env(safe-area-inset-left,0px)); --pr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#121418; --bar:#1d2025; --card:#252a31; --ui-ink:#e7e4da; --ui-dim:#a3a9b1; --line:#3b4048;
    --accent:#93b2ff; --accent-ink:#0b1022; --danger:#ff8f86; --ok:#7fd29a; --warn:#e8b45e; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#121418; --bar:#1d2025; --card:#252a31; --ui-ink:#e7e4da; --ui-dim:#a3a9b1; --line:#3b4048;
  --accent:#93b2ff; --accent-ink:#0b1022; --danger:#ff8f86; --ok:#7fd29a; --warn:#e8b45e; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ui-ink);font:14px/1.5 var(--f-ui);-webkit-text-size-adjust:100%;overflow:hidden}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* top bar */
.bar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px var(--pr) 8px var(--pl);background:var(--bar);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font:600 17px var(--f-ui);letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.bar h1 small{font:400 11px var(--f-mono);color:var(--ui-dim)}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:transparent;padding:5px 11px;border-radius:3px;cursor:pointer;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ui-dim)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[aria-pressed="true"]{background:var(--ui-ink);color:var(--bar);border-color:var(--ui-ink)}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg .btn:last-child{border-radius:0 3px 3px 0}
.aistat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ui-dim);display:inline-block}
.dot.connecting{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.dot.ready{background:var(--ok)}
.dot.busy{background:var(--accent);animation:pulse .8s ease-in-out infinite}
.dot.off{background:transparent;border:1.5px solid var(--ui-dim)}
@keyframes pulse{50%{opacity:.3}}

.lbar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px var(--pr) 6px var(--pl);background:var(--bar);border-bottom:1px solid var(--line);font-size:13px}
.lbar .lt{font-weight:600}
.lbar .ls{font:500 12px var(--f-mono);color:var(--ui-dim)}
.lbar .sp{flex:1}

/* desk & paper */
.desk{flex:1;min-height:0;overflow:auto;padding:14px var(--pr) 14px var(--pl);display:flex;flex-direction:column}
.paper{flex:1 1 0;min-height:430px;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);position:relative;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:19px 19px;
  box-shadow:0 1px 0 rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.28);border-radius:2px}
.boardwrap{position:relative;overflow:hidden;touch-action:none;min-height:0;min-width:0;cursor:crosshair;user-select:none;-webkit-user-select:none}
.boardwrap.t-hand{cursor:grab}.boardwrap.t-hand.dragging{cursor:grabbing}.boardwrap.t-eraser{cursor:cell}
#stage{position:absolute;left:0;top:0;width:1200px;height:750px;transform-origin:0 0}
#board{position:absolute;left:0;top:0;width:1200px;height:750px;overflow:visible}
#ink{position:absolute;left:0;top:0;width:1200px;height:750px;pointer-events:none}
#ink.absorb{transition:opacity 1.2s ease-in,filter 1.2s ease-in;opacity:0;filter:blur(5px)}
.margin{border-left:3px double var(--margin-line);overflow-y:auto;padding:16px 18px 80px 22px;min-height:0;position:relative;color:var(--ink-ai);scroll-behavior:auto}
.note{font-family:var(--f-ai);font-size:22px;line-height:1.22;margin:0 0 .45em;color:var(--ink-ai);word-break:keep-all;overflow-wrap:anywhere}
.note .w{display:inline-block;white-space:nowrap}
.note .c{display:inline-block;animation:inkin .5s ease-out both}
.note.now .c{animation:none}
@keyframes inkin{from{opacity:0;filter:blur(3.5px);transform:translateY(1px) scale(1.08)}to{opacity:1;filter:blur(0);transform:none}}
.note.user{font-family:var(--f-user);font-size:20px;line-height:1.4;color:var(--ink-user);transition:opacity 1.8s ease}
.note.user.soaked{opacity:.35}
.note.boss{font-family:var(--f-boss);font-size:29px;color:var(--ink-boss)}
.stamp{display:inline-block;font:600 11px var(--f-ui);border:1.5px solid var(--ink-boss);color:var(--ink-boss);padding:0 6px;margin-right:8px;transform:rotate(-3deg);vertical-align:middle;letter-spacing:.08em}
.note.sys{font:400 13px/1.5 var(--f-ui);color:var(--pencil);border-left:3px solid var(--pencil);padding-left:9px;opacity:.9}
.note.sys.err{border-color:var(--ink-boss);color:#7d2a22}
.cut{border:0;border-top:1.5px dashed var(--pencil);opacity:.5;margin:14px 0}
.pbtn{font-family:var(--f-user);font-size:18px;font-weight:700;background:transparent;color:var(--ink-user);border:2px solid var(--ink-user);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:2px 16px 3px;cursor:pointer;margin:4px 8px 4px 0}
.pbtn:hover:not(:disabled){background:rgba(28,63,148,.08)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pbtn:focus-visible{outline-color:var(--ink-user)}
.quiz{border:1.5px dashed var(--pencil);padding:10px 12px 8px;margin:8px 0 14px;position:relative;background:rgba(255,255,255,.35);animation:fadein .5s both}
.quiz .qtag{position:absolute;top:-10px;left:10px;background:var(--paper);padding:0 6px;font:600 11px var(--f-ui);letter-spacing:.1em;color:var(--pencil)}
.quiz .qq{word-break:keep-all;margin:2px 0 6px;font-family:var(--f-user);font-size:19px;line-height:1.35;color:var(--ink-ai)}
.quiz .qa{margin:6px 0 2px;font-family:var(--f-ai);font-size:26px;line-height:1.2;color:var(--ink-ai);border-top:1px dotted var(--pencil);padding-top:4px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.thinking{position:relative;height:70px;margin:6px 0 10px}
.thinking .blot{position:absolute;left:18px;top:26px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,rgba(42,28,21,.85),rgba(42,28,21,.35) 55%,transparent 72%);filter:blur(2px);animation:blot 3.8s ease-in-out infinite;transform:scale(.2);opacity:0}
.thinking .blot:nth-child(2){left:52px;top:18px;animation-delay:1.2s}
.thinking .blot:nth-child(3){left:92px;top:30px;animation-delay:2.4s}
.thinking .tx{position:absolute;left:130px;top:22px;font:400 13px var(--f-ui);color:var(--pencil)}
@keyframes blot{0%{transform:scale(.2);opacity:0}25%{opacity:.9}100%{transform:scale(2.4);opacity:0}}

/* board svg */
#board text{user-select:none;-webkit-user-select:none}
.tl{font:500 9px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:#3b3f45;text-anchor:middle;paint-order:stroke;stroke:#f6f1e1;stroke-width:2.6px;stroke-linejoin:round}
.tl.sm{font-size:7.5px}
.cl{font:400 17px 'Gaegu','Nanum Pen Script','Malgun Gothic',cursive;fill:#33363c;paint-order:stroke;stroke:#f6f1e1;stroke-width:3px;stroke-linejoin:round}
.ph{font:400 15px 'Gaegu','Nanum Pen Script','Malgun Gothic',cursive;fill:#4b4f56;text-anchor:middle}
.pm{font:500 9px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:#5b5f66;text-anchor:middle}
.pm.big{font-size:17px;fill:#2b3a33}
.pm.sm{font-size:12px}
.mk{font:400 30px 'Nanum Pen Script','Gaegu','Malgun Gothic',cursive;fill:#d0312d;paint-order:stroke;stroke:#f6f1e1;stroke-width:3px;stroke-linejoin:round}
.ttl{font:400 52px 'Nanum Pen Script','Gaegu','Malgun Gothic',cursive;fill:#1d1a2e;text-anchor:middle}
.wt{font:500 9px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:#2b2b2b;text-anchor:middle}
.screw{fill:#cfc9b4;stroke:#4b4f56;stroke-width:1.2}
.slot{stroke:#4b4f56;stroke-width:1}
.hit{fill:transparent;cursor:pointer}
.whit{fill:none;stroke:transparent;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.selring{fill:rgba(12,107,92,.15);stroke:#0c6b5c;stroke-width:2}
.selwire{fill:none;stroke:rgba(12,107,92,.35);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.st{font:400 24px 'Nanum Pen Script','Gaegu','Malgun Gothic',cursive;fill:#4b4f56}
.st.halo{paint-order:stroke;stroke:#f6f1e1;stroke-width:5px;stroke-linejoin:round}
.ft{animation:fadein .35s both}
.now .ft,.inst .ft{animation:none}

/* dock */
.dock{flex:none;background:var(--bar);border-top:1px solid var(--line);padding:8px var(--pr) max(10px,env(safe-area-inset-bottom,0px)) var(--pl)}
.dock-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dock-row + .dock-row{margin-top:8px;align-items:stretch}
.dock .hint{font-size:12px;color:var(--ui-dim);flex:1;min-width:140px}
.dock textarea{flex:1 1 260px;min-width:0;resize:none;border:1px solid var(--line);background:var(--card);padding:7px 10px;border-radius:3px;font:15px/1.45 var(--f-ui);height:58px}
.dock textarea:disabled{opacity:.6}
.dock .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.bossban{display:flex;gap:8px;align-items:center;margin-bottom:8px;padding:5px 10px;border:1px solid var(--danger);color:var(--danger);font-size:13px;border-radius:3px}
.bossban .sp{flex:1}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);z-index:41;background:var(--card);border-right:1px solid var(--line);transform:translateX(-102%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;
  padding:14px 14px max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease}
.drawer header{display:flex;align-items:center;justify-content:space-between}
.drawer h2{margin:0;font:600 16px var(--f-ui)}
.lcard{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;background:transparent;border:1px solid var(--line);border-radius:3px;padding:9px 10px;cursor:pointer}
.lcard:hover{border-color:var(--accent)}
.lcard.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lcard .no{font:400 36px/1 var(--f-ai);color:var(--ui-ink);text-align:center}
.lcard .tt{font-weight:600;font-size:14px}
.lcard .sb{font-size:12.5px;color:var(--ui-dim)}
.lcard .mt{font:400 11px var(--f-mono);color:var(--ui-dim);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.lcard .trk{border:1px solid var(--line);padding:0 5px;border-radius:2px}
.cgh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ui-ink)}
.cgh:hover{border-bottom-color:var(--accent)}
.cgh .ar{width:14px;color:var(--ui-dim);font-size:11px}
.cgh .cn{flex:1}
.cgh .cd{font:500 12px var(--f-mono);color:var(--ui-dim)}
.cgb{display:flex;flex-direction:column;gap:8px;padding:8px 0 6px}
.lcard .done{color:var(--ok);font-size:12px;font-weight:600;white-space:nowrap}

/* info card */
#info{position:fixed;z-index:30;width:min(310px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);box-shadow:0 8px 26px rgba(0,0,0,.35);padding:12px 14px;border-radius:4px;font-size:13px;line-height:1.5}
#info h3{margin:0 24px 2px 0;font:600 14px var(--f-ui)}
#info .sub{font:400 11.5px var(--f-mono);color:var(--ui-dim);margin-bottom:6px}
#info p{margin:4px 0}
#info ul{margin:4px 0;padding-left:16px}
#info .x{position:absolute;top:6px;right:6px;border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;padding:4px 8px;color:var(--ui-dim)}
#info .sw{display:inline-block;width:22px;height:6px;border:1px solid #222;vertical-align:middle;margin-right:5px}
#info .k{color:var(--ui-dim)}

@media (max-width:899px){
  .paper{flex:none;min-height:0;grid-template-columns:1fr;grid-template-rows:auto auto}
  .boardwrap{aspect-ratio:1200/750;width:100%}
  .margin{border-left:0;border-top:3px double var(--margin-line);min-height:260px;max-height:none;overflow:visible;padding-bottom:40px}
  .note{font-size:20px}
  .dock .hint{display:none}
  .dock .hint.warn{display:block;flex-basis:100%;color:var(--warn)}
  .aistat .lab{display:none}
  .bar h1 small{display:none}
}
/* 동작 시뮬레이터 */
#gSim{pointer-events:none}
.simon .sim-clk{cursor:pointer}
.sim-live{fill:none;stroke:#ffb000;stroke-opacity:.38;stroke-width:5;stroke-dasharray:2 7;stroke-linecap:round;stroke-linejoin:round}
.sim-glow{fill:none;stroke:#c76a00;stroke-opacity:.32;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.sim-flow{fill:none;stroke:#ffb000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 13;animation:sflow .6s linear infinite}
.sim-flow.rev{animation-direction:reverse}
.sim-flow.static{stroke-dasharray:none;stroke-opacity:.55;stroke-width:6;animation:none}
@keyframes sflow{to{stroke-dashoffset:-14}}
.sim-short{fill:none;stroke:#e5271b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;animation:sblink .5s steps(2) infinite}
@keyframes sblink{50%{opacity:.15}}
.sim-coil{fill:rgba(255,170,0,.12);stroke:#f08a00;stroke-width:3}
.sim-badge{fill:#f08a00}.sim-badge.off{fill:#b3261e}
.sim-bt{font:700 11px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:#fff;text-anchor:middle}
.sim-t{font:700 15px 'Gaegu','Nanum Pen Script','Malgun Gothic',cursive;fill:#b3261e;text-anchor:middle;paint-order:stroke;stroke:#f6f1e1;stroke-width:3px;stroke-linejoin:round}
.sim-lcd{font:500 10px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:#9fe3b5;text-anchor:middle}
.sim-spin{animation:sspin 1s linear infinite}.sim-spin.rev{animation-direction:reverse}
@keyframes sspin{to{transform:rotate(360deg)}}
.sim-pb{fill:#fffbe6;stroke:#0c6b5c;stroke-width:1.6}
.sim-pt{font:400 22px 'Nanum Pen Script','Gaegu','Malgun Gothic',cursive;fill:#2a1c15}
.sim-pop{animation:popin .25s ease-out both;transition:opacity .3s}
@keyframes popin{from{opacity:0}to{opacity:1}}
.sim-wob{font-size:26px;animation:simwob .9s ease-in-out 4}
@keyframes simwob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#finger{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5;opacity:0}
#finger span{position:absolute;left:-15px;top:-4px;font-size:40px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transform-origin:50% 10%;transition:transform .12s}
#finger.tap span{transform:scale(.8) translateY(5px)}
.dock .hint.sim{color:var(--ok);font-weight:500}
@media (max-width:899px){.dock .hint.sim{display:block;flex-basis:100%}}
/* SPEC5: 자막 강사 · 레이저 · 비트 진행 · 애니메이션 위젯 */
.boardcol{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.boardcol .boardwrap{flex:1 1 0}
.cap{position:relative;flex:none;display:flex;gap:14px;align-items:center;padding:8px 20px 14px 14px;min-height:calc(2.56em + 22px);background:rgba(251,247,232,.97);border-top:2.5px solid #1d1a2e;cursor:pointer;color:#1d1a2e;font-family:var(--f-ai);font-size:30px;line-height:1.28;word-break:keep-all;overflow-wrap:anywhere;animation:capin .3s ease-out both}
.cap.boss{border-top-color:#c2271d;background:rgba(255,244,240,.97)}
@keyframes capin{from{opacity:.4}to{opacity:1}}
.cap.out{opacity:0;transition:opacity .25s}
.capbadge{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:64px}
.capbadge .st{width:46px;height:46px;border-radius:50%;border:3px double #c2271d;color:#c2271d;display:flex;align-items:center;justify-content:center;font:700 19px var(--f-ui);transform:rotate(-8deg);letter-spacing:-.04em}
.cap.boss .capbadge .st{border-radius:6px;font-size:14px;width:54px;height:34px;margin:6px 0}
.capbadge .nm{font:600 11px var(--f-ui);color:#4b4f56;white-space:nowrap}
.captxt{flex:1;min-width:0}
.captxt .w{display:inline-block;white-space:nowrap}
.captxt .c{display:inline-block;animation:inkin .45s ease-out both}
.captxt.now .c{animation:none}
.captxt .c.b{background:linear-gradient(transparent 50%,rgba(255,214,0,.62) 50% 94%,transparent 94%)}
.captxt .c.r{color:#d0312d;font-weight:700;box-shadow:inset 0 -3px 0 rgba(208,49,45,.75)}
.captxt .c.n{color:#1f5fbf;font-weight:700}
.note .c.b{background:linear-gradient(transparent 55%,rgba(255,214,0,.5) 55%)}
.note .c.r{color:#d0312d}.note .c.n{color:#1f5fbf}
#tapHint{position:absolute;right:12px;bottom:2px;font:600 13px var(--f-ui);color:#1d1a2e;background:rgba(255,255,255,.75);padding:0 10px;border-radius:10px;pointer-events:none;animation:tapblink 1.3s ease-in-out infinite}
@keyframes tapblink{50%{opacity:.25}}
#laser{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .2s}
#laser i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ff3b30 35%,rgba(255,59,48,.35) 62%,transparent 72%);box-shadow:0 0 14px 4px rgba(255,59,48,.55)}
.lprog{flex:0 0 120px;height:6px;border-radius:3px;background:rgba(0,0,0,.14);overflow:hidden}
.lprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.sim-tap{font-size:18px;opacity:.7;animation:tapblink 1.6s ease-in-out infinite}
.an-hit{fill:transparent;cursor:pointer}
@media (max-width:899px){

<script>/* parts.js - 추가 그림 부품 26종 (엔진이 window.EXTRA_PARTS를 CAT에 합친다)
   좌표는 부품 중심 (0,0) 기준, 그림은 +-w/2, +-h/2 안. */
(function () {
  'use strict';
  const INK = '#4b4f56', BODY = '#ebe6d6', BODY2 = '#d9d3bf', PAPER = '#f6f1e1';
  const METAL = '#c9ced3', METAL2 = '#aeb4ba', CU = '#c8793a', CU2 = '#e0a468', DARK = '#2e2e33', GRIP = '#bf4a3c';
  const WCOL = {
    brown: '#7a4a21', black: '#1c1c1c', gray: '#8d9097', blue: '#1f5fbf', greenyellow: '#2f9a3d',
    red: '#d12a2a', yellow: '#f2c200', orange: '#f07d00', white: '#fbfaf5'
  };
  const SLEEVE = { red: '#d9473b', blue: '#2f6fcf', yellow: '#f2c200' };
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  /* 전선/슬리브 색칠: 녹황이면 노란 줄무늬 */
  function colored(p, x, y, w, h, col, o) {
    const hex = has(WCOL, col) ? WCOL[col] : (SLEEVE[col] || WCOL.gray);
    p.rect(x, y, w, h, Object.assign({ fill: hex, strokeWidth: 1.4 }, o));
    if (col === 'greenyellow' && w > h) {
      for (let i = 4; i <= w - h - 2; i += 11) p.line(x + i, y + h - 1, x + i + h - 2, y + 1, { stroke: '#e8d21d', strokeWidth: 2.6, roughness: .4 });
    }
  }
  /* 슬리브 색 결정: 없음이면 null, 모르는 값은 기본(빨강) */
  function sleeveOf(col) {
    if (col === 'none') return null;
    if (col && has(SLEEVE, col)) return SLEEVE[col];
    if (col && has(WCOL, col)) return WCOL[col];
    return SLEEVE.red;
  }
  function arrow(p, x1, y1, x2, y2, o) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = 8;
    p.line(x1, y1, x2, y2, o);
    p.line(x2, y2, x2 - L * Math.cos(a - .45), y2 - L * Math.sin(a - .45), o);
    p.line(x2, y2, x2 - L * Math.cos(a + .45), y2 - L * Math.sin(a + .45), o);
  }
  const tag = (p, x, y, s) => p.text(x, y, s, 'pm sm');
  const lcdText = (p, x, y, s, n) => p.text(x, y, s, String(s).length <= (n || 6) ? 'pm big' : 'pm sm', '#2b3a33');
  const botLab = (w, h, fs) => [0, h / 2 - 4, 'middle', fs || 15];

  /* XBM 모듈 공통: 연한 회색 몸체, 40핀 커넥터, LED 줄, 이름 글자 */
  function xbm(p, name, w) {
    p.rect(-w / 2, -45, w, 90, { fill: '#e4e6e8', strokeWidth: 1.7 });
    p.rect(-w / 2 + 10, -36, 58, 34, { fill: '#3a3b40', strokeWidth: 1.3 });
    p.line(-w / 2 + 16, -26, -w / 2 + 62, -26, { stroke: METAL, strokeWidth: 3, strokeLineDash: [2, 3], roughness: .3 });
    p.line(-w / 2 + 16, -14, -w / 2 + 62, -14, { stroke: METAL, strokeWidth: 3, strokeLineDash: [2, 3], roughness: .3 });
    p.text(30, -22, name, 'pm sm');
    for (let r = 0; r < 2; r++) for (let i = 0; i < 8; i++) p.circle(-70 + i * 20, -2 + r * 12, 6, { fill: i % 3 === 0 && r === 0 ? '#6cc77a' : PAPER, strokeWidth: 1 });
    p.circle(130, -2, 7, { fill: '#6cc77a', strokeWidth: 1 });
    tag(p, 130, 16, 'RUN');
  }

  window.EXTRA_PARTS = {
    /* ---------------------------------------------------------- 전선 가공 */
    WIRE: {
      name: '전선 끝(피복 벗김)', w: 260, h: 44, top: [], bot: [],
      info: '탈피한 전선 끝. 연선은 여러 가닥이라 유연해 판넬·진동 부위에, 단선은 한 가닥으로 고정 배선에 씀. 탈피 길이는 단자에 맞춤.',
      ai: 'props color: 전선색 이름, kind: stranded|solid, strip: 탈피 길이 글자(예 "8mm")',
      td: {}, lab: botLab(260, 44),
      draw(p, c) {
        const pr = c.props, col = has(WCOL, pr.color) ? pr.color : 'black', solid = pr.kind === 'solid', cy = -5;
        colored(p, -124, cy - 8, 138, 16, col);
        p.line(-124, cy - 8, -124, cy + 8, { strokeWidth: 2 });
        if (solid) {
          p.rect(14, cy - 4.5, 110, 9, { fill: CU, strokeWidth: 1.2 });
          p.line(18, cy - 1.5, 120, cy - 1.5, { stroke: CU2, strokeWidth: 1.4, roughness: .4 });
          p.ellipse(124, cy, 5, 9, { fill: CU2, strokeWidth: 1 });
        } else {
          [-5, -2.5, 0, 2.5, 5].forEach(y => p.line(14, cy + y, 122, cy + y * 1.5, { stroke: CU, strokeWidth: 1.7, roughness: .5 }));
          p.line(14, cy - 3, 120, cy - 7.5, { stroke: CU2, strokeWidth: 1, roughness: .5 });
        }
        if (pr.strip) {
          p.line(14, 12, 50, 12, { strokeWidth: 1 }); p.line(88, 12, 124, 12, { strokeWidth: 1 });
          p.line(14, 8, 14, 16, { strokeWidth: 1 }); p.line(124, 8, 124, 16, { strokeWidth: 1 });
          tag(p, 69, 15, String(pr.strip));
        }
      }
    },
    RING: {
      name: '링(O형) 압착단자', w: 140, h: 54, top: [], bot: [],
      info: '링(O형) 압착단자. 나사를 다 풀어야 끼우지만 풀려도 잘 안 빠져 진동 부위·동력선·접지에 많이 씀. 슬리브 색: 빨강 1.25 / 파랑 2 / 노랑 5.5 계열.',
      ai: 'props color: red|blue|yellow(절연 슬리브색)|none(나단자)', td: {}, lab: botLab(140, 54),
      draw(p, c) {
        const sl = sleeveOf(c.props.color), cy = -8;
        p.circle(-50, cy, 32, { fill: METAL });
        p.circle(-50, cy, 13, { fill: PAPER, strokeWidth: 1.2 });
        p.path('M-36,-16 L-22,-14 L-22,-2 L-36,0 Z', { fill: METAL });
        if (sl) {
          p.rect(-22, cy - 7, 30, 14, { fill: METAL });
          p.rect(4, cy - 10, 62, 20, { fill: sl, strokeWidth: 1.5 });
          p.line(14, cy - 10, 14, cy + 10, { strokeWidth: 1, roughness: .5 });
          p.line(58, cy - 8, 58, cy + 8, { strokeWidth: 1, roughness: .5 });
          p.line(10, cy - 6, 52, cy - 6, { stroke: 'rgba(255,255,255,.45)', strokeWidth: 2, roughness: .4 });
        } else {
          p.rect(-22, cy - 7, 66, 14, { fill: METAL });
          p.line(-22, cy, 44, cy, { strokeWidth: 1, roughness: .5 });
          p.circle(22, cy, 4, { fill: PAPER, strokeWidth: 1 });
        }
      }
    },
    FORK: {
      name: 'Y형(포크) 압착단자', w: 140, h: 54, top: [], bot: [],
      info: 'Y형(포크) 압착단자. 나사만 살짝 풀고 끼워 작업이 편하지만 나사가 풀리면 빠질 수 있음. 슬리브 색: 빨강 1.25 / 파랑 2 / 노랑 5.5 계열.',
      ai: 'props color: red|blue|yellow(절연 슬리브색)|none(나단자)', td: {}, lab: botLab(140, 54),
      draw(p, c) {
        const sl = sleeveOf(c.props.color), cy = -8;
        p.path('M-22,-14 C-30,-14 -34,-24 -42,-24 L-68,-24 L-68,-14 L-52,-14 L-52,-2 L-68,-2 L-68,8 L-42,8 C-34,8 -30,-2 -22,-2 Z', { fill: METAL });
        if (sl) {
          p.rect(-22, cy - 7, 30, 14, { fill: METAL });
          p.rect(4, cy - 10, 62, 20, { fill: sl, strokeWidth: 1.5 });
          p.line(14, cy - 10, 14, cy + 10, { strokeWidth: 1, roughness: .5 });
          p.line(58, cy - 8, 58, cy + 8, { strokeWidth: 1, roughness: .5 });
          p.line(10, cy - 6, 52, cy - 6, { stroke: 'rgba(255,255,255,.45)', strokeWidth: 2, roughness: .4 });
        } else {
          p.rect(-22, cy - 7, 66, 14, { fill: METAL });
          p.line(-22, cy, 44, cy, { strokeWidth: 1, roughness: .5 });
          p.circle(22, cy, 4, { fill: PAPER, strokeWidth: 1 });
        }
      }
    },
    PIN: {
      name: '핀 압착단자', w: 140, h: 40, top: [], bot: [],
      info: '핀 압착단자. 좁은 단자 구멍에 꽂는 용도. 슬리브 색: 빨강 1.25 / 파랑 2 / 노랑 5.5 계열(제조사 표 확인).',
      ai: 'props color: red|blue|yellow(절연 슬리브색)|none(나단자)', td: {}, lab: botLab(140, 40),
      draw(p, c) {
        const sl = sleeveOf(c.props.color), cy = -8;
        p.rect(-68, cy - 3, 40, 6, { fill: METAL, strokeWidth: 1.2 });
        p.line(-68, cy, -62, cy, { strokeWidth: 1, roughness: .4 });
        p.rect(-28, cy - 6, 26, 12, { fill: METAL });
        if (sl) {
          p.rect(-2, cy - 9, 68, 18, { fill: sl, strokeWidth: 1.5 });
          p.line(8, cy - 9, 8, cy + 9, { strokeWidth: 1, roughness: .5 });
          p.line(56, cy - 7, 56, cy + 7, { strokeWidth: 1, roughness: .5 });
          p.line(14, cy - 5, 50, cy - 5, { stroke: 'rgba(255,255,255,.45)', strokeWidth: 2, roughness: .4 });
        } else {
          p.rect(-2, cy - 6, 52, 12, { fill: METAL });
          p.line(-2, cy, 50, cy, { strokeWidth: 1, roughness: .5 });
        }
      }
    },
    FERRULE: {
      name: '봉형단자(페룰)', w: 140, h: 40, top: [], bot: [],
      info: '봉형단자(페룰). 연선 가닥을 하나로 묶어 단자에 확실히 물리고 옆 단자와의 단락·가닥 끊김을 막음. 슬리브 색은 제조사마다 다름.',
      ai: 'props color: 슬리브 색 이름(아무 색)', td: {}, lab: botLab(140, 40),
      draw(p, c) {
        const sl = sleeveOf(c.props.color) || '#8d9097', cy = -8;
        p.rect(-66, cy - 6, 62, 12, { fill: METAL });
        p.ellipse(-66, cy, 5, 12, { fill: CU2, strokeWidth: 1 });
        p.line(-60, cy - 3, -8, cy - 3, { stroke: 'rgba(255,255,255,.6)', strokeWidth: 1.4, roughness: .4 });
        p.rect(-4, cy - 9, 48, 18, { fill: sl, strokeWidth: 1.5 });
        p.rect(44, cy - 11, 8, 22, { fill: sl, strokeWidth: 1.4 });
        p.line(2, cy - 4, 38, cy - 4, { stroke: 'rgba(255,255,255,.45)', strokeWidth: 2, roughness: .4 });
        p.line(52, cy, 68, cy, { stroke: CU, strokeWidth: 2, roughness: .4 });
      }
    },

    {"t":"say","text":"현장에선 아직 R·S·T라 부르지만, 색은 이 순서로 외워 두세요."},
    {"t":"place","type":"TR","id":"TR1","x":250,"y":330,"label":"제어용 트랜스 380/220V"},
    {"t":"wire","from":"PWR.R","to":"TR1.P1","color":"brown","v":"AC380V","no":"R1","why":"트랜스 1차는 380V라서 R상과 S상 사이에 걸어요."},
    {"t":"wire","from":"PWR.S","to":"TR1.P2","color":"black","v":"AC380V","no":"S1","why":"R-S 선간 380V를 만들려고 S상을 1차 반대쪽에 이어요."},
    {"t":"step"},
    {"t":"say","text":"트랜스가 380V를 220V로 낮춰요. 1차는 380V, 2차 S1-S2가 220V."},
    {"t":"place","type":"SMPS","id":"PS1","x":650,"y":330,"label":"SMPS 220V→24V"},
    {"t":"wire","from":"TR1.S1","to":"PS1.L","color":"yellow","v":"AC220V","no":"L","why":"SMPS는 220V를 받아 DC24V를 만드니 트랜스 2차 220V를 넣어요."},
    {"t":"wire","from":"TR1.S2","to":"PS1.N","color":"yellow","v":"AC220V","no":"N","why":"220V는 두 선이 한 쌍이라 2차의 나머지 한 선도 SMPS에 이어요."},
    {"t":"say","text":"제어선 색은 회사마다 달라요. 도면 범례(LEGEND)부터 꼭 확인하세요!"},
    {"t":"step"},
    {"t":"place","type":"LAMP","id":"H1","x":650,"y":540,"color":"green","label":"DC24V 표시등"},
    {"t":"wire","from":"PS1.+V","to":"H1.X1","color":"red","v":"DC24V","no":"P24","why":"+24V는 적색으로, 부하의 + 쪽 단자에 이어요."},
    {"t":"wire","from":"PS1.-V","to":"H1.X2","color":"blue","v":"DC24V","no":"N24","why":"0V는 청색으로 부하의 반대쪽 단자에 이어 전류가 돌아오게 해요."},
    {"t":"say","text":"SMPS가 220V를 DC24V로 바꿔요. +V는 24V, -V는 0V예요."},
    {"t":"say","text":"제어를 24V로 하는 이유는 감전 위험이 낮고, PLC·센서가 24V 표준이라서!"},
    {"t":"demo","title":"수전을 껐다 켜 봐요","ops":[{"t":"say","text":"램프가 켜져 있죠? 수전 PWR을 눌러 꺼 볼게요."},{"t":"wait","ms":900},{"t":"act","id":"PWR","do":"off"},{"t":"pop","at":"H1","text":"램프 꺼짐!"},{"t":"say","text":"트랜스, SMPS, 램프까지 줄줄이 꺼져요. 전기는 한 줄로 이어진 길이에요."},{"t":"wait","ms":1500},{"t":"act","id":"PWR","do":"on"},{"t":"pop","at":"H1","text":"램프 ON"},{"t":"say","text":"다시 켜면 380V → 220V → 24V 순서로 전기가 와서 램프가 켜져요."},{"t":"wait","ms":1200}]},
    {"t":"step"},
    {"t":"say","text":"결선 전에 꼭! 차단기 OFF, 잠금·표지(LOTO), 검전기로 무전압 확인."},
    {"t":"circle","at":"PWR"},
    {"t":"say","text":"전압 지도가 머리에 있어도 검전 없이 손대면 안 돼요. 활선 작업은 금지!"},
    {"t":"step"},
    {"t":"say","who":"boss","text":"부장님: 이 선 220V야 24V야? 근거 대 봐."},
    {"t":"say","text":"모범답안: 선번호와 도면 범례를 확인합니다. 상-N은 220V, 상끼리는 380V, 제어는 24V예요."},
    {"t":"step"},
    {"t":"quiz","q":"R-N 사이 전압이 220V인 이유는?","a":"선간전압 380V를 루트3(약 1.73)으로 나눈 상전압이라서."},
    {"t":"quiz","q":"제어회로를 DC24V로 쓰는 이유 두 가지는?","a":"감전 위험이 낮고, PLC·센서의 표준 전압이라 호환이 쉬워서."}
  ] },
{ id: "l2", course: "ctrl", no: 2, title: "모터 주회로", sub: "MCCB→MC→THR→모터와 PE 접지", minutes: 7,
  ops: [
    {"t":"clear"},
    {"t":"title","text":"모터 주회로"},
    {"t":"say","text":"주회로는 모터를 돌리는 '굵은 전기'의 길이에요. 순서는 MCCB→MC→THR→모터!"},
    {"t":"place","type":"PWR","id":"PWR","x":500,"y":100,"label":"수전 380V"},
    {"t":"place","type":"MCCB","id":"Q1","x":500,"y":225,"label":"MCCB 배선용차단기"},
    {"t":"wire","from":"PWR.R","to":"Q1.L1","color":"brown","v":"AC380V","no":"R1","why":"R상(L1)을 차단기 전원측으로 끌어와요."},
    {"t":"wire","from":"PWR.S","to":"Q1.L2","color":"black","v":"AC380V","no":"S1","why":"S상(L2)도 같은 차단기에 넣어 3상을 한꺼번에 끊게 해요."},
    {"t":"wire","from":"PWR.T","to":"Q1.L3","color":"gray","v":"AC380V","no":"T1","why":"T상(L3)까지 3상 모두 차단기를 거치게 해요."},
    {"t":"say","text":"MCCB는 합선·과전류에서 선을 지키는 맨 앞 차단기예요. 위쪽 L1·L2·L3로 받아요."},
    {"t":"step"},
    {"t":"place","type":"MC","id":"MC1","x":500,"y":380,"label":"MC-9b"},
    {"t":"wire","from":"Q1.T1","to":"MC1.L1","color":"brown","v":"AC380V","no":"R2","why":"차단기 출력 T1을 MC의 전원측 1/L1로 보내요."},
    {"t":"wire","from":"Q1.T2","to":"MC1.L2","color":"black","v":"AC380V","no":"S2","why":"차단기 출력 T2를 MC의 전원측 3/L2로 보내요."},
    {"t":"wire","from":"Q1.T3","to":"MC1.L3","color":"gray","v":"AC380V","no":"T2","why":"차단기 출력 T3를 MC의 전원측 5/L3로 보내요."},
    {"t":"say","text":"MC는 큰 전기를 대신 켜 주는 '전기 스위치 머슴'이에요. 코일이 자석이 되면 접점이 붙어요."},
    {"t":"say","text":"여기선 LS Metasol MC-9b예요. 380/440V에서 9A·4kW(AC-3)급이에요."},
    {"t":"say","text":"MC-9b는 코일 전압 종류가 많아요. 명판에서 꼭 확인! AC 코일에 DC를 넣으면 소손돼요."},
    {"t":"say","text":"단자 규칙! 홀수 1·3·5는 전원측, 짝수 2·4·6은 부하측이에요. 진짜 중요!"},
    {"t":"mark","at":"MC1.L1","text":"1/L1 전원측"},
    {"t":"mark","at":"MC1.T1","text":"2/T1 부하측"},
    {"t":"step"},
    {"t":"place","type":"THR","id":"THR1","x":500,"y":525,"label":"MT-32 과부하계전기"},
    {"t":"wire","from":"MC1.T1","to":"THR1.L1","color":"brown","v":"AC380V","no":"R3","why":"MC 출력 2/T1을 THR 입력 L1에 이어 전류가 THR을 통과하게 해요."},
    {"t":"wire","from":"MC1.T2","to":"THR1.L2","color":"black","v":"AC380V","no":"S3","why":"MC 출력 4/T2를 THR 입력 L2에 이어요."},
    {"t":"wire","from":"MC1.T3","to":"THR1.L3","color":"gray","v":"AC380V","no":"T3","why":"MC 출력 6/T3를 THR 입력 L3에 이어요."},
    {"t":"say","text":"THR은 모터가 과부하로 뜨거워지는 걸 감시하는 보디가드예요. 여기선 MT-32!"},
    {"t":"say","text":"MT-32는 MC-9b에 바로 붙여 써요. 95-96은 NC(트립 시 열림), 97-98은 NO(경보용)."},
    {"t":"say","text":"과전류가 오래 흐르면 95-96 접점이 열려 코일 전원이 끊기고 MC가 떨어져요."},
    {"t":"step"},
    {"t":"place","type":"MOTOR","id":"M1","x":500,"y":680,"label":"3상 유도전동기"},
    {"t":"wire","from":"THR1.T1","to":"M1.U","color":"brown","v":"AC380V","no":"U1","why":"THR을 지난 전류가 모터 권선 U로 들어가요."},
    {"t":"wire","from":"THR1.T2","to":"M1.V","color":"black","v":"AC380V","no":"V1","why":"THR 출력 T2를 모터 V로 이어요."},
    {"t":"wire","from":"THR1.T3","to":"M1.W","color":"gray","v":"AC380V","no":"W1","why":"THR 출력 T3를 모터 W로 이어요."},
    {"t":"say","text":"THR 출력 T1·T2·T3를 모터 U·V·W에 이어요. 둘을 맞바꾸면 회전 방향이 바뀌니 조심!"},
    {"t":"step"},
    {"t":"wire","from":"PWR.PE","to":"M1.PE","color":"greenyellow","v":"PE","no":"PE","why":"모터 몸체를 땅(접지)에 연결해 누전 전류가 땅으로 빠지게 해요."},
    {"t":"say","text":"PE는 녹황색 접지선이에요. 모터 몸체에 꼭 연결해요."},
    {"t":"say","text":"누전되면 전류가 접지로 빠져 몸체 전압이 낮아지고, 누전차단기(ELB)가 있으면 동작해요."},
    {"t":"circle","at":"M1.PE"},
    {"t":"demo","title":"차단기와 MC를 눌러 봐요","ops":[{"t":"say","text":"MCCB를 내리면 아래로 전기가 안 가요. 눌러 볼게요."},{"t":"act","id":"Q1","do":"off"},{"t":"pop","at":"Q1","text":"MCCB OFF"},{"t":"say","text":"차단기가 내려가면 MC 앞까지도 전기가 끊겨요."},{"t":"wait","ms":1200},{"t":"act","id":"Q1","do":"on"},{"t":"pop","at":"MC1","text":"전기가 MC 앞까지!"},{"t":"say","text":"차단기를 올리면 MC 앞까지 전기가 와요. 아직 모터는 안 돌아요."},{"t":"wait","ms":1300},{"t":"act","id":"MC1","do":"on"},{"t":"pop","at":"M1","text":"모터 회전!"},{"t":"say","text":"MC가 붙으면 THR을 지나 모터까지! (실제론 코일이 붙여요)"},{"t":"wait","ms":2200},{"t":"act","id":"MC1","do":"off"},{"t":"pop","at":"M1","text":"모터 정지"},{"t":"say","text":"MC가 떨어지면 모터도 멈춰요. MC가 모터의 스위치예요."},{"t":"wait","ms":1000}]},
    {"t":"step"},
    {"t":"say","who":"boss","text":"부장님: THR은 왜 달았어? 그리고 PE는 안 달면 뭐가 문제야?"},
    {"t":"say","text":"모범답안: THR은 과부하로 모터가 타는 걸 막으려고, PE는 누전 때 감전을 막고 차단기를 동작시키려고 답니다."},
    {"t":"step"},
    {"t":"quiz","q":"MC의 2/T1, 4/T2, 6/T3는 전원측일까 부하측일까?","a":"부하측(모터쪽). 홀수는 전원측, 짝수는 부하측이에요."},
    {"t":"quiz","q":"THR이 트립하면 어느 접점이 열려서 MC 코일을 끊나?","a":"95-96 b접점이 열려요. 97-98 a접점은 닫혀서 경보에 써요."}
  ] },
{ id: "l3", course: "ctrl", no: 3, title: "자기유지 회로", sub: "손을 떼도 계속 붙어 있는 이유", minutes: 8,
  ops: [
    {"t":"clear"},
    {"t":"title","text":"자기유지 회로"},
    {"t":"say","text":"제어회로 시간! 이번엔 제어전원 R-N 220V를 서킷프로텍터 CP로 받아요."},
    {"t":"place","type":"PWR","id":"PWR","x":200,"y":110,"label":"수전 380V"},
    {"t":"place","type":"CP","id":"CP1","x":200,"y":260,"label":"CP 제어 보호"},
    {"t":"wire","from":"PWR.R","to":"CP1.1","color":"brown","v":"AC220V","no":"R","why":"제어전원은 R상과 N 사이 220V를 쓰니 R상을 CP 1번으로 보내요."},
    {"t":"wire","from":"PWR.N","to":"CP1.3","color":"blue","v":"AC220V","no":"N","why":"N선을 CP 3번으로 보내 R-N 220V 한 쌍을 만들어요."},
    {"t":"say","text":"CP는 제어회로 전용 차단기예요. 제어선이 합선돼도 여기서 먼저 끊겨요."},
    {"t":"step"},
    {"t":"place","type":"PB","id":"PB_OFF","x":200,"y":430,"color":"red","label":"정지 PB"},
    {"t":"wire","from":"CP1.2","to":"PB_OFF.11","color":"yellow","v":"AC220V","no":"101","why":"정지 버튼 b접점(11-12)을 맨 앞에 직렬로 넣어요."},
    {"t":"say","text":"정지 버튼은 b접점(11-12) 직렬! 누르면 열려서 전체 전원이 끊겨요."},
    {"t":"say","text":"선이 끊겨도 '정지'로 가라고 b접점이에요. 이거 진짜 중요해요."},
    {"t":"step"},
    {"t":"place","type":"PB","id":"PB_ON","x":420,"y":430,"color":"green","label":"기동 PB"},
    {"t":"place","type":"MC","id":"MC1","x":680,"y":430,"label":"MC-9b"},
    {"t":"wire","from":"PB_OFF.12","to":"PB_ON.13","color":"yellow","v":"AC220V","no":"102","why":"정지 버튼을 지난 전기가 기동 버튼 a접점(13-14)으로 와요."},
    {"t":"wire","from":"PB_ON.14","to":"MC1.A1","color":"yellow","v":"AC220V","no":"103","why":"기동 버튼을 누르면 전기가 MC 코일 A1으로 들어가요."},
    {"t":"say","text":"기동 버튼은 a접점(13-14)이에요. 누르고 있는 동안만 이어져 코일 A1에 전기가 가요."},
    {"t":"step"},
    {"t":"place","type":"THR","id":"THR1","x":680,"y":620,"label":"MT-32"},
    {"t":"wire","from":"MC1.A2","to":"THR1.95","color":"yellow","v":"AC220V","no":"104","why":"코일을 지난 전기가 THR의 b접점 95로 가서 과부하 감시를 직렬로 해요."},
    {"t":"wire","from":"THR1.96","to":"CP1.4","color":"blue","v":"AC220V","no":"N","why":"THR 96을 N(CP 4번)에 돌려 코일에 220V 회로를 완성해요."},
    {"t":"say","text":"코일 A2는 THR 95-96을 거쳐 N으로 돌아가요. 이제 버튼을 누르면 코일이 켜져요."},
    {"t":"say","text":"MT-32가 트립하면 95-96이 열려서 코일이 꺼져요. 모터 보호가 자동으로!"},
    {"t":"say","text":"MT-32의 95-96(NC)을 코일 회로에 직렬로, 97-98(NO)은 경보용이에요. 리셋은 수동/자동 선택."},
    {"t":"step"},
    {"t":"wire","from":"PB_OFF.12","to":"MC1.13","color":"yellow","v":"AC220V","no":"102","why":"MC 자기 a접점 13을 기동 버튼 13과 같은 지점에 이어 병렬을 만들어요."},
    {"t":"wire","from":"MC1.14","to":"PB_ON.14","color":"yellow","v":"AC220V","no":"103","why":"MC 접점 14를 기동 버튼 14와 이어 버튼 대신 코일에 전기를 보내요."},
    {"t":"mark","at":"MC1.13","text":"자기유지 접점"},
    {"t":"circle","at":"MC1"},
    {"t":"say","text":"MC 보조 a접점 13-14를 기동 버튼 13-14와 병렬로! 이게 자기유지예요."},
    {"t":"say","text":"MC-9b는 보조접점 1a1b 내장! 13-14(NO)는 자기유지, 21-22(NC)는 인터록에 써요."},
    {"t":"say","text":"MC가 붙으면 자기 접점이 닫혀요. 손을 떼도 스스로 전원을 유지하는 거죠."},
    {"t":"demo","title":"자기유지를 눌러 봐요","ops":[{"t":"say","text":"기동 PB를 누르고 있을게요."},{"t":"act","id":"PB_ON","do":"press"},{"t":"pop","at":"MC1","text":"코일에 전기 들어옴!"},{"t":"wait","ms":1200},{"t":"act","id":"PB_ON","do":"release"},{"t":"say","text":"손을 뗐는데도 MC는 붙어 있어요. 13-14 자기유지!"},{"t":"wait","ms":1600},{"t":"act","id":"PB_OFF","do":"press"},{"t":"pop","at":"MC1","text":"정지: 전원 끊김"},{"t":"wait","ms":1000},{"t":"act","id":"PB_OFF","do":"release"},{"t":"say","text":"정지 PB(b접점)가 열리면 MC가 떨어져요. 손을 떼도 안 붙어요."},{"t":"wait","ms":1500},{"t":"act","id":"PB_ON","do":"press"},{"t":"wait","ms":900},{"t":"act","id":"PB_ON","do":"release"},{"t":"say","text":"다시 기동하면 또 붙고 유지돼요."},{"t":"wait","ms":1000}]},
    {"t":"step"},
    {"t":"place","type":"LAMP","id":"H_TRIP","x":950,"y":620,"color":"red","label":"고장 램프"},
    {"t":"wire","from":"CP1.2","to":"THR1.97","color":"yellow","v":"AC220V","no":"105","why":"트립 때 닫히는 a접점 97의 입구에 제어 L을 넣어요."},
    {"t":"wire","from":"THR1.98","to":"H_TRIP.X1","color":"yellow","v":"AC220V","no":"106","why":"트립으로 97-98이 닫히면 램프 X1에 전기가 가요."},
    {"t":"wire","from":"H_TRIP.X2","to":"CP1.4","color":"blue","v":"AC220V","no":"N","why":"램프 반대쪽을 N으로 돌려 회로를 완성해요."},
    {"t":"say","text":"보너스! THR 97-98은 a접점이라 트립 때 닫혀서 고장 램프를 켜 줘요."},
    {"t":"demo","title":"과부하 트립을 눌러 봐요","ops":[{"t":"say","text":"먼저 기동해서 MC를 붙여 둘게요."},{"t":"act","id":"PB_ON","do":"press"},{"t":"wait","ms":900},{"t":"act","id":"PB_ON","do":"release"},{"t":"wait","ms":600},{"t":"say","text":"이제 THR을 눌러 과부하 트립을 만들어요."},{"t":"act","id":"THR1","do":"on"},{"t":"pop","at":"MC1","text":"MC 떨어짐"},{"t":"pop","at":"H_TRIP","text":"고장 램프 ON"},{"t":"say","text":"95-96이 열려 MC가 떨어지고, 97-98이 닫혀 고장 램프가 켜져요."},{"t":"wait","ms":2000},{"t":"act","id":"THR1","do":"off"},{"t":"say","text":"리셋하면 램프는 꺼지지만 MC는 안 붙어요. 기동을 다시 눌러요."},{"t":"wait","ms":1500}]},
    {"t":"step"},
    {"t":"say","who":"boss","text":"부장님: 기동 버튼에서 손 뗐는데 왜 MC가 안 떨어지나?"},
    {"t":"say","text":"모범답안: MC 보조 a접점 13-14가 기동 버튼과 병렬이라, 코일 전원을 자기가 유지하기 때문입니다."},
    {"t":"step"},
    {"t":"quiz","q":"정지 버튼은 왜 b접점을 직렬로 넣을까?","a":"누르면 열려 전원을 끊고, 선이 끊겨도 정지 쪽으로 가는 안전한 방식이라서."},

{"id":"m7","course":"mid","no":7,"title":"래더와 PLC 스캔","sub":"NC 정지버튼은 a접점으로","minutes":10,"ops":[
    {"t":"clear"},

    {"t":"say","text":"이제 PLC 프로그램! 래더는 시퀀스 도면을 PLC용으로 옮겨 그린 거예요. 양옆 세로선이 전원 모선이에요."},
    {"t":"say","text":"접점 직렬은 AND, 병렬은 OR. 이 규칙은 도면과 똑같아요."},
    {"t":"say","text":"XBM 주소로 쓸게요. P0000 기동 병렬 P0020, 직렬 P0001 정지, 코일 P0020이에요."},
    {"t":"text","x":150,"y":120,"text":"왼쪽 모선","size":"s"},
    {"t":"text","x":850,"y":120,"text":"오른쪽 모선","size":"s","align":"end"},
    {"t":"ladder","x":150,"y":150,"w":700,"rows":[[{"k":"a","l":"P0000","or":"P0020"},{"k":"a","l":"P0001"},{"k":"coil","l":"P0020"}]],"note":"자기유지 래더: P0000(기동) 병렬 P0020, 직렬 P0001(정지), 코일 P0020. P0001은 a접점으로 그렸어요(이유는 다음 장)."},
    {"t":"text","x":150,"y":350,"text":"병렬 = OR · 직렬 = AND","size":"l"},
    {"t":"text","x":150,"y":410,"text":"P0000 기동 / P0001 정지 / P0020 출력(자기유지)"},
    {"t":"text","x":150,"y":470,"text":"─┤ ├─ a접점   ─┤/├─ b접점   ─( )─ 코일","size":"s"},
    {"t":"text","x":150,"y":530,"text":"XBM-DN32H2 입력 P0000~ · 출력 P0020~","size":"s"},
    {"t":"step"},

    {"t":"title","text":"정지 버튼 배선"},
    {"t":"say","text":"가장 헷갈리는 부분! 실물 정지 버튼은 b접점(NC, 11-12)으로 P0001에 배선해요."},
    {"t":"say","text":"XBM 입력은 COM 하나, 소스/싱크 공용! 예시는 NPN 센서 그룹이라 COM=+24V로 가정(실기 확인)."},
    {"t":"place","type":"SMPS","id":"PS1","x":200,"y":120,"label":"SMPS DC24V"},

    {"t":"wire","from":"PS1.+V","to":"XIN.COM","color":"red","v":"DC24V","no":"P24","why":"입력 COM을 +24V에 물려요(NPN 센서와 같은 그룹 가정). COM이 +24V면 접점은 입력점과 0V 사이에 넣어요."},
    {"t":"wire","from":"PB_STOP.12","to":"XIN.P01","color":"orange","v":"DC24V","no":"P01","why":"b접점 출구 12를 입력 P0001로. 평소엔 닫혀 있어 P0001이 0V와 이어져 입력 ON이에요."},
    {"t":"wire","from":"PS1.-V","to":"PB_STOP.11","color":"blue","v":"DC24V","no":"N24","why":"정지 버튼 b접점 입구 11을 0V에 물려요."},
    {"t":"mark","at":"PB_STOP.11","text":"NC 11-12 사용"},

    {"t":"say","text":"입력이 ON이니 래더에선 a접점으로 써요. 누르면 OFF가 되어 접점이 열려요."},

    {"t":"say","text":"이 반에서 모든 전선은 6가지 정보를 가져요. 선번(W0001…), 굵기(㎟), 색, 양쪽 압착단자 형번, 조임 토크(N·m), 그리고 출처 코드예요."},
    {"t":"say","text":"출처 코드는 M=제조사 설명서, S=표준(KEC 등), C=회사 자료, D=계산, X=설계 선택이에요. 대본에 [M-MCCB·S-CABLE]처럼 붙어 있으면 그 근거로 정한 값이라는 뜻이에요."},
    {"t":"say","text":"선 색은 L1 갈색, L2 흑색, L3 회색, N 청색, PE 녹/황이에요. DC24V는 + 적색, 0V 청색이고 신호선도 적색 0.75㎟로 통일했어요. [S-ID·C-MEMO]"},

    {"t":"say","text":"결선 전에는 무조건 LOTO! 차단기 OFF → 잠금·표지 → 검전기로 0V 확인. 순서를 바꾸면 안 돼요. 시운전 1단계도 무전압 점검부터 시작해요. [X-COMMISSION]"},

    {"t":"wire","from":"PE.5","to":"PS1.FG","color":"greenyellow","v":"PE","no":"W0258","why":"PE 단자대 5번에서 SMPS PS1 보호접지 FG 단자로 한 가닥씩 따로 이어요. 그래서 1.5㎟ 녹/황이에요(PE는 녹/황). PE.5 쪽은 페룰 PHOENIX AI 1,5-8, 0.6 N·m / PS1.FG 쪽은 링단자 PHOENIX C-RCI 1,5/M3,5 / 3240017, 0.9 N·m [S-PE·M-GA700·X-WIRE·M-PE·X-ARCH·M-LRS·M-LRS-INSTALL]"},

    {"t":"wire","from":"PE.10","to":"CAB.PE-frame","color":"greenyellow","v":"PE","no":"W0263","why":"PE 단자대 10번을 함 본체 CAB의 함 프레임 접지 볼트로 이어 함 전체가 같은 접지 전위가 되게 해요. 그래서 16㎟ 녹/황이에요(PE는 녹/황). PE.10 쪽은 페룰 PHOENIX AI 16-18, 2.8 N·m / CAB.PE-frame 쪽은 페룰 PHOENIX AI 16-18, 3.1 N·m [S-PE·M-GA700·X-WIRE·M-PE·X-ARCH·X-LAYOUT]"},

  ops: [

    {"t":"say","text":"24V 전원은 P24(+24V)와 N24(0V) 분배대에서 나눠 써요. 먼저 PLC 본체 XBM-DN32H2의 전원 단자예요. 각인은 +, -, PE예요. 1.5㎟ 적색/청색을 써요. [M-XBM·X-WIRE]"},
    {"t":"wire","from":"P24.2","to":"PLC.+","color":"red","v":"DC24V","no":"W0072","why":"+24V 분배대 2번을 PLC 본체 전원 단자 +로 보내 PLC를 켜요. 그래서 1.5㎟ 적색이에요(DC +24V 계열은 적색). P24.2 쪽은 페룰 PHOENIX AI 1,5-8, 0.6 N·m / PLC.+ 쪽은 전원 플러그 스프링 / 1.5mm² 스프링에 삽입, 스프링이라 토크 없음 [X-WIRE·M-UT·M-XBM·X-ARCH]"},
    {"t":"wire","from":"N24.2","to":"PLC.-","color":"blue","v":"DC24V","no":"W0073","why":"0V 분배대 2번을 PLC 본체 전원 단자 -(0V)에 이어 전류가 돌아올 길을 만들어요. 그래서 1.5㎟ 청색이에요(N·DC 0V는 청색). N24.2 쪽은 페룰 PHOENIX AI 1,5-8, 0.6 N·m / PLC.- 쪽은 전원 플러그 스프링 / 1.5mm² 스프링에 삽입, 스프링이라 토크 없음 [X-WIRE·M-UT·M-XBM·X-ARCH]"},
    {"t":"mark","at":"PLC.+","text":"PLC 전원 +24V"},
    {"t":"step"},
    {"t":"place","type":"M_LS_XTB_40H_F75F","id":"XT0","x":280,"y":365,"label":"XT0"},
    {"t":"say","text":"XT0은 PLC 본체 40핀 커넥터를 C40HH-10SB-XBI 완성 케이블로 빼 온 단자대(XTB-40H)예요. XTB 명판의 A/B 번호는 PLC 커넥터의 A/B와 달라요. 예를 들어 XT0.A19는 커넥터 A4(+24V)예요. 변환표대로 봐야 해요. [M-XTB]"},
    {"t":"wire","from":"P24.3","to":"XT0.A19","color":"red","v":"DC24V","no":"W0074","why":"+24V 분배대 3번을 인출 단자대 XT0의 +24V 핀 A19에 이어요. XTB 변환 핀맵에서 A19가 PLC 커넥터의 +24V에 해당해요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). P24.3 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m / XT0.A19 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m [X-WIRE·M-UT·M-XTB·X-ARCH]"},
    {"t":"wire","from":"P24.4","to":"XT0.B19","color":"red","v":"DC24V","no":"W0075","why":"+24V 분배대 4번을 인출 단자대 XT0의 +24V 핀 B19에 이어요. XTB 변환 핀맵에서 B19가 PLC 커넥터의 +24V에 해당해요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). P24.4 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m / XT0.B19 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m [X-WIRE·M-UT·M-XTB·X-ARCH]"},
    {"t":"circle","at":"XT0.A19"},
    {"t":"step"},
    {"t":"say","text":"출력 쪽 공통 OUT_COM(XT0 A20·B20)은 N24에 이어요. PLC 출력은 NPN 싱크라서 출력이 ON되면 그 핀이 0V로 내려가요. 부하가 +24V에서 0V로 전류를 흘리려면 OUT_COM이 0V여야 해요."},
    {"t":"wire","from":"N24.3","to":"XT0.A20","color":"blue","v":"DC24V","no":"W0076","why":"0V 분배대 3번을 XT0의 출력 공통 OUT_COM A20에 이어 싱크 출력의 귀로 0V를 만들어요. 그래서 0.75㎟ 청색이에요(N·DC 0V는 청색). N24.3 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m / XT0.A20 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m [X-WIRE·M-UT·M-XTB·X-ARCH]"},
    {"t":"wire","from":"N24.4","to":"XT0.B20","color":"blue","v":"DC24V","no":"W0077","why":"0V 분배대 4번을 XT0의 출력 공통 OUT_COM B20에 이어 싱크 출력의 귀로 0V를 만들어요. 그래서 0.75㎟ 청색이에요(N·DC 0V는 청색). N24.4 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m / XT0.B20 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m [X-WIRE·M-UT·M-XTB·X-ARCH]"},

    {"t":"say","text":"입력 쪽 공통 IN_COM(XT0 A10·B10)도 N24예요. 현장 센서는 PNP 24V 방식이라 검출하면 +24V를 입력에 내보내요. 그러니 입력 공통은 0V여야 전류가 돌아가요. [X-FIELD]"},
    {"t":"wire","from":"N24.5","to":"XT0.A10","color":"blue","v":"DC24V","no":"W0078","why":"0V 분배대 5번을 XT0 입력 공통 IN_COM A10에 이어요. PNP 센서가 보내는 +24V의 귀로가 돼요. 그래서 0.75㎟ 청색이에요(N·DC 0V는 청색). N24.5 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m / XT0.A10 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m [X-WIRE·M-UT·M-XTB·X-ARCH]"},

    {"t":"say","text":"부장님: 비상정지를 PLC로 받아서 PLC가 끄면 되잖아. 왜 안전 릴레이를 따로 써?","who":"boss"},
    {"t":"say","text":"모범답안: PLC는 프로그램이 멈추거나 출력이 고착될 수 있어서 안전 기능을 맡기지 않아요. SR이 두 채널을 하드웨어로 감시해서 STO와 안전 접촉기를 직접 끊어요. PLC에는 상태(P007)만 알려요 [X-SAFETY]."},

    {"t":"say","text":"루프 끝(KSB3 32)은 SR M52 입력으로 돌아가요. SR은 모든 인버터가 STO이고 모든 접촉기가 떨어진 것을 확인해야 리셋을 받아 줘요. 한 군데 고장 나면 비상정지를 풀어도 안 올라와요. [X-SAFETY]"},

    {"t":"say","text":"부장님: 접촉기 하나가 용접돼서 안 떨어지면? 모터가 계속 돌잖아. 그걸 어떻게 알아?","who":"boss"},
    {"t":"say","text":"모범답안: 접촉기 NC 보조접점(31-32)을 직렬로 SR M52에 돌려서 알아요. 접촉기가 안 떨어지면 NC가 열려 있어서 루프가 끊기고, SR이 리셋을 거부해서 새 운전을 못 해요 [X-SAFETY·M-SFC]."},
    {"t":"quiz","q":"STO 입력 H1·H2에 +24V가 사라지면 인버터는 어떻게 되나요?","a":"출력 트랜지스터 구동을 바로 차단해서 모터에 토크가 나가지 않아요(STO) [M-GA700]."},

    {"t":"quiz","q":"EDM 피드백 루프에는 어떤 접점이 직렬로 들어가나요?","a":"인버터 M5-M6(STO EDM) 3개와 안전 접촉기 6개의 NC 31-32예요 [M-GA700]."}

    {"t":"say","text":"부장님: PLC가 출력을 켰으면 접촉기는 당연히 붙은 거 아냐? 피드백까지 받는 건 낭비 아냐?","who":"boss"},
    {"t":"say","text":"모범답안: 접촉기는 코일 고장, 접점 용접, 배선 단선으로 안 붙거나 안 떨어질 수 있어요. 명령과 피드백이 다르면 운전을 금지하는 게 이 설계의 불변조건이에요. 모터가 돌지 않는데 브레이크를 푸는 사고를 막아요 [X-COMMISSION]."},

    {"t":"say","text":"GA700 디지털 입력은 SC(공통)와 SN(0V)에 외부 24V를 주는 싱크 방식이에요. SC에 +24V, SN에 0V를 이어요. 공장 점퍼(SC-SP, SC-SN)는 반드시 뽑아요. 안 뽑으면 내부 전원과 섞여요. [M-GA700]"},
    {"t":"wire","from":"P24.7","to":"INV1.SC","color":"red","v":"DC24V","no":"W0090","why":"+24V 분배대 7번을 LIFT 인버터 INV1의 입력 공통 SC에 이어요. 외부 24V 싱크 방식의 +쪽 공통이에요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). P24.7 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m / INV1.SC 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·X-WIRE·M-UT·X-ARCH]"},
    {"t":"wire","from":"N24.15","to":"INV1.SN","color":"blue","v":"DC24V","no":"W0091","why":"0V 분배대 15번을 LIFT 인버터 INV1의 SN에 이어요. PLC 싱크 출력이 당겨 내릴 0V 기준이에요. 그래서 0.75㎟ 청색이에요(N·DC 0V는 청색). N24.15 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m / INV1.SN 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·X-WIRE·M-UT·X-ARCH]"},
    {"t":"mark","at":"INV1.SC","text":"SC=+24V"},

    {"t":"place","type":"M_LS_XTB_40H_1JIB","id":"XT0","x":600,"y":644,"label":"XT0"},
    {"t":"say","text":"S1은 정회전 FWD(H1-01=40), S2는 역회전 REV(H1-02=41)예요. PLC P020, P021이 이 핀을 0V로 당기면 인버터가 그 방향으로 돌아요. 둘을 동시에 켜면 안 돼요. [C-IO·M-GA700]"},
    {"t":"wire","from":"XT0.A11","to":"INV1.S1","color":"red","v":"DC24V","no":"W0092","why":"PLC가 인출 단자대 XT0의 A11 단자를 0V로 내리면(P020 INV FWD) LIFT 인버터 INV1의 S1 정회전 FWD 입력 (H1-01=40)이 ON돼요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). XT0.A11 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m / INV1.S1 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·M-XBM·X-WIRE·M-XTB·X-ARCH]"},
    {"t":"wire","from":"XT0.B11","to":"INV1.S2","color":"red","v":"DC24V","no":"W0093","why":"PLC가 인출 단자대 XT0의 B11 단자를 0V로 내리면(P021 INV REV) LIFT 인버터 INV1의 S2 역회전 REV 입력 (H1-02=41)이 ON돼요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). XT0.B11 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m / INV1.S2 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·M-XBM·X-WIRE·M-XTB·X-ARCH]"},
    {"t":"circle","at":"INV1.S1"},
    {"t":"step"},
    {"t":"say","text":"S4는 리셋(H1-04=14)이고 S5·S6·S7은 다단속 X1·X2·X3(H1-05=3, H1-06=4, H1-07=5)예요. S3은 KTH가 쓰는 외부 고장 정지(H1-03=24, 17강)고, S8은 안 써요(H1-08=F)."},
    {"t":"wire","from":"XT0.A12","to":"INV1.S4","color":"red","v":"DC24V","no":"W0094","why":"PLC가 인출 단자대 XT0의 A12 단자를 0V로 내리면(P022 INV RST) LIFT 인버터 INV1의 S4 리셋 입력 (H1-04=14)이 ON돼요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). XT0.A12 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m / INV1.S4 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·M-XBM·X-WIRE·M-XTB·X-ARCH]"},
    {"t":"wire","from":"XT0.B12","to":"INV1.S5","color":"red","v":"DC24V","no":"W0095","why":"PLC가 인출 단자대 XT0의 B12 단자를 0V로 내리면(P023 INV X1) LIFT 인버터 INV1의 S5 다단속 X1 입력 (H1-05=3)이 ON돼요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). XT0.B12 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m / INV1.S5 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·M-XBM·X-WIRE·M-XTB·X-ARCH]"},
    {"t":"wire","from":"XT0.A13","to":"INV1.S6","color":"red","v":"DC24V","no":"W0096","why":"PLC가 인출 단자대 XT0의 A13 단자를 0V로 내리면(P024 INV X2) LIFT 인버터 INV1의 S6 다단속 X2 입력 (H1-06=4)이 ON돼요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). XT0.A13 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m / INV1.S6 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·M-XBM·X-WIRE·M-XTB·X-ARCH]"},
    {"t":"wire","from":"XT0.B13","to":"INV1.S7","color":"red","v":"DC24V","no":"W0097","why":"PLC가 인출 단자대 XT0의 B13 단자를 0V로 내리면(P025 INV X3) LIFT 인버터 INV1의 S7 다단속 X3 입력 (H1-07=5)이 ON돼요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). XT0.B13 쪽은 링단자 PHOENIX C-RCI 1,5/M3 / 3240016, 1.2 N·m / INV1.S7 쪽은 연선 0.75mm² bare end 스프링에 삽입, 스프링이라 토크 없음 [M-GA700·M-XBM·X-WIRE·M-XTB·X-ARCH]"},

    {"t":"say","text":"X1·X2·X3의 켜짐 조합이 속도 번호를 만들어요. 번호 0~7이 d1-01~d1-08이고 값은 0, 5, 10, 15, 20, 30, 45, 60Hz예요. 예를 들어 X1과 X2만 ON이면 번호 3이라 d1-04 = 15Hz예요. [X-COMMISSION]"},
    {"t":"say","text":"가감속은 C1-01 = C1-02 = 5초, 외부 단자 운전은 b1-02=1, 속도는 다단속 레지스터로 b1-01=0이에요. 모터 입력은 E1-01 380V, E1-04·E1-06 60Hz, E2-01 41.5A, E2-11 22kW예요."},

    {"t":"say","text":"CART 모터는 BE5(유지 0.33A, 28N·m)예요. 구조는 LIFT와 같고 보호기 CPB2(3RV2011-0EA20)를 0.33A × 1.1 = 0.363A로 맞춰요. 분배대는 XD-L2 4번, XD-N 4번을 써요. [D-BRAKE·M-3RV04]"},
    {"t":"wire","from":"XD-L2.4","to":"CPB2.1/L1","color":"black","v":"AC220V","no":"W0328","why":"분배대 XD-L2의 4번 단자의 L2(S)상을 CART 브레이크 보호기 CPB2의 1/L1 단자로 받아요. 브레이크는 모터와 별개의 AC220V 전용 회로예요. 그래서 1.5㎟ 흑색이에요(L2는 흑색). XD-L2.4 쪽은 페룰 PHOENIX AI 1,5-8, 3.5 N·m / CPB2.1/L1 쪽은 연선 1.5mm² 직접 삽입 스프링에 삽입, 스프링이라 토크 없음 [M-3RV04·M-UT35·X-WIRE]"},
    {"t":"wire","from":"CPB2.2/T1","to":"CPB2.3/L2","color":"black","v":"AC220V","no":"W0329","why":"CPB2의 T1과 L2를 점퍼로 이어 L선이 극 두 개를 차례로 지나게 해요. 그래서 1.5㎟ 흑색이에요(L2는 흑색). CPB2.2/T1 쪽은 연선 1.5mm² 직접 삽입 스프링에 삽입, 스프링이라 토크 없음 / CPB2.3/L2 쪽은 연선 1.5mm² 직접 삽입 스프링에 삽입, 스프링이라 토크 없음 [M-3RV04·X-WIRE]"},
    {"t":"wire","from":"XD-N.4","to":"CPB2.5/L3","color":"blue","v":"AC220V","no":"W0330","why":"분배대 XD-N의 4번 단자의 N(중성선)을 CART 브레이크 보호기 CPB2의 5/L3 단자로 받아요. 브레이크는 모터와 별개의 AC220V 전용 회로예요. 그래서 1.5㎟ 청색이에요(N·DC 0V는 청색). XD-N.4 쪽은 페룰 PHOENIX AI 1,5-8, 3.5 N·m / CPB2.5/L3 쪽은 연선 1.5mm² 직접 삽입 스프링에 삽입, 스프링이라 토크 없음 [M-3RV04·M-UT35·X-WIRE]"},
    {"t":"mark","at":"CPB2.1/L1","text":"BE5 유지 0.33A"},
    {"t":"circle","at":"CPB2.5/L3"},

    {"t":"say","text":"안전 접촉기 KSA2·KSB2과 브레이크 접촉기 KB2이 L선 위에 직렬로 서 있어요. KSA2·KSB2은 비상정지 때 떨어지고, KB2는 PLC(P12E)가 켜고 꺼요. 셋 중 하나만 열려도 브레이크 전원이 끊겨요. [X-SAFETY]"},
    {"t":"wire","from":"CPB2.4/T2","to":"KSA2.1/L1","color":"black","v":"AC220V","no":"W0331","why":"브레이크 L선 L2(S)상을 CART 브레이크 보호기 CPB2의 4/T2 단자에서 CART 안전 MC KSA2의 1/L1 단자로 이어요. 직렬이라 한 접촉기만 열려도 끊겨요. 그래서 1.5㎟ 흑색이에요(L2는 흑색). CPB2.4/T2 쪽은 연선 1.5mm² 직접 삽입 스프링에 삽입, 스프링이라 토크 없음 / KSA2.1/L1 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-3RV04·M-MC·X-WIRE]"},
    {"t":"wire","from":"KSA2.2/T1","to":"KSB2.1/L1","color":"black","v":"AC220V","no":"W0332","why":"브레이크 L선 L2(S)상을 CART 안전 MC KSA2의 2/T1 단자에서 CART 안전 MC KSB2의 1/L1 단자로 이어요. 직렬이라 한 접촉기만 열려도 끊겨요. 그래서 1.5㎟ 흑색이에요(L2는 흑색). KSA2.2/T1 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / KSB2.1/L1 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"wire","from":"KSB2.2/T1","to":"KB2.1/L1","color":"black","v":"AC220V","no":"W0333","why":"브레이크 L선 L2(S)상을 CART 안전 MC KSB2의 2/T1 단자에서 CART 브레이크 MC KB2의 1/L1 단자로 이어요. 직렬이라 한 접촉기만 열려도 끊겨요. 그래서 1.5㎟ 흑색이에요(L2는 흑색). KSB2.2/T1 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / KB2.1/L1 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"wire","from":"KB2.2/T1","to":"BME2.2","color":"black","v":"AC220V","no":"W0334","why":"브레이크 L선 L2(S)상을 CART 브레이크 MC KB2의 2/T1 단자에서 CART 브레이크 정류기 BME2의 2번 단자로 이어요. 직렬이라 한 접촉기만 열려도 끊겨요. 그래서 1.5㎟ 흑색이에요(L2는 흑색). KB2.2/T1 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / BME2.2 쪽은 페룰 PHOENIX AI 1,5-8, 0.55 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"mark","at":"KSA2.1/L1","text":"안전 MC 직렬"},
    {"t":"step"},
    {"t":"say","text":"N선도 똑같이 세 접촉기를 지나 BME 정류기 AC1(단자 1)로 가요. 한 극만 끊지 않고 AC 두 극을 모두 끊어야 해요. [M-SEW-INSTALL p.190]"},
    {"t":"wire","from":"CPB2.6/T3","to":"KSA2.3/L2","color":"blue","v":"AC220V","no":"W0335","why":"브레이크 N선 N(중성선)을 CART 브레이크 보호기 CPB2의 6/T3 단자에서 CART 안전 MC KSA2의 3/L2 단자로 이어요. AC 두 극을 모두 끊기 위해 N도 접점을 지나가요. 그래서 1.5㎟ 청색이에요(N·DC 0V는 청색). CPB2.6/T3 쪽은 연선 1.5mm² 직접 삽입 스프링에 삽입, 스프링이라 토크 없음 / KSA2.3/L2 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-3RV04·M-MC·X-WIRE]"},
    {"t":"wire","from":"KSA2.4/T2","to":"KSB2.3/L2","color":"blue","v":"AC220V","no":"W0336","why":"브레이크 N선 N(중성선)을 CART 안전 MC KSA2의 4/T2 단자에서 CART 안전 MC KSB2의 3/L2 단자로 이어요. AC 두 극을 모두 끊기 위해 N도 접점을 지나가요. 그래서 1.5㎟ 청색이에요(N·DC 0V는 청색). KSA2.4/T2 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / KSB2.3/L2 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"wire","from":"KSB2.4/T2","to":"KB2.3/L2","color":"blue","v":"AC220V","no":"W0337","why":"브레이크 N선 N(중성선)을 CART 안전 MC KSB2의 4/T2 단자에서 CART 브레이크 MC KB2의 3/L2 단자로 이어요. AC 두 극을 모두 끊기 위해 N도 접점을 지나가요. 그래서 1.5㎟ 청색이에요(N·DC 0V는 청색). KSB2.4/T2 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / KB2.3/L2 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"wire","from":"KB2.4/T2","to":"BME2.1","color":"blue","v":"AC220V","no":"W0338","why":"브레이크 N선 N(중성선)을 CART 브레이크 MC KB2의 4/T2 단자에서 CART 브레이크 정류기 BME2의 1번 단자로 이어요. AC 두 극을 모두 끊기 위해 N도 접점을 지나가요. 그래서 1.5㎟ 청색이에요(N·DC 0V는 청색). KB2.4/T2 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / BME2.1 쪽은 페룰 PHOENIX AI 1,5-8, 0.55 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"step"},
    {"t":"say","text":"세 번째 극은 DC 쪽이에요. BME 3-4번 사이를 접점으로 열면 정류기 직류측이 끊겨서 브레이크가 훨씬 빨리 잡혀요. 그래서 BME 3 → KSA2 5/L3 → … → KB2 6/T3 → BME 4로 돌아와요. [M-SEW-BME p.42]"},
    {"t":"wire","from":"BME2.3","to":"KSA2.5/L3","color":"black","v":"AC220V","no":"W0339","why":"정류기 DC 급속차단 단자 CART 브레이크 정류기 BME2의 3번 단자를 CART 안전 MC KSA2의 5/L3 단자로 이어요. AC와 DC를 함께 끊는 세 번째 극이에요. 그래서 1.5㎟ 흑색이에요(DC 급속차단 루프도 흑색). BME2.3 쪽은 페룰 PHOENIX AI 1,5-8, 0.55 N·m / KSA2.5/L3 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"wire","from":"KSA2.6/T3","to":"KSB2.5/L3","color":"black","v":"AC220V","no":"W0340","why":"급속차단 루프를 CART 안전 MC KSA2의 6/T3 단자에서 CART 안전 MC KSB2의 5/L3 단자로 이어요. 그래서 1.5㎟ 흑색이에요(DC 급속차단 루프도 흑색). KSA2.6/T3 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / KSB2.5/L3 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"wire","from":"KSB2.6/T3","to":"KB2.5/L3","color":"black","v":"AC220V","no":"W0341","why":"급속차단 루프를 CART 안전 MC KSB2의 6/T3 단자에서 CART 브레이크 MC KB2의 5/L3 단자로 이어요. 그래서 1.5㎟ 흑색이에요(DC 급속차단 루프도 흑색). KSB2.6/T3 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / KB2.5/L3 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m [M-SEW-BME·M-MC·X-WIRE]"},
    {"t":"wire","from":"KB2.6/T3","to":"BME2.4","color":"black","v":"AC220V","no":"W0342","why":"CART 브레이크 MC KB2의 6/T3 단자를 CART 브레이크 정류기 BME2의 4번 단자로 되돌려 DC 급속차단 루프를 닫아요. 그래서 1.5㎟ 흑색이에요(DC 급속차단 루프도 흑색). KB2.6/T3 쪽은 페룰 PHOENIX AI 1,5-8, 2.25 N·m / BME2.4 쪽은 페룰 PHOENIX AI 1,5-8, 0.55 N·m [M-SEW-BME·M-MC·X-WIRE]"},

    {"t":"say","text":"정류기 출력 13(적 RD)·14(백 WH)·15(청 BU)가 모터 단자대 XB2로 나가고, 거기서 3심 1.5㎟ 케이블로 SEW BE5 브레이크에 가요. 브레이크 코일은 DC 96V예요. [CBL-B2]"},
    {"t":"wire","from":"BME2.13","to":"XB2-RD.1","color":"red","v":"DC96V","no":"W0343","why":"정류기 출력 13(1번(현장·바깥쪽 접속))을 XB2-RD의 1번 단자로 이어요. 모터 쪽 BE 브레이크로 DC 전압이 나가요. 그래서 1.5㎟ 적색이에요(RD 적·WH 백·BU 청이 SEW 정류기 출력선 색). BME2.13 쪽은 페룰 PHOENIX AI 1,5-8, 0.55 N·m / XB2-RD.1 쪽은 페룰 PHOENIX AI 1,5-8, 0.6 N·m [M-SEW-BME·M-UT·X-WIRE]"},
    {"t":"wire","from":"BME2.14","to":"XB2-WH.1","color":"white","v":"DC96V","no":"W0344","why":"정류기 출력 14(1번(현장·바깥쪽 접속))을 XB2-WH의 1번 단자로 이어요. 모터 쪽 BE 브레이크로 DC 전압이 나가요. 그래서 1.5㎟ 백색이에요(RD 적·WH 백·BU 청이 SEW 정류기 출력선 색). BME2.14 쪽은 페룰 PHOENIX AI 1,5-8, 0.55 N·m / XB2-WH.1 쪽은 페룰 PHOENIX AI 1,5-8, 0.6 N·m [M-SEW-BME·M-UT·X-WIRE]"},

    {"t":"say","text":"모범답안: 하나가 용접돼도 다른 하나가 끊어 주려고요. 거기에 두 접촉기의 NC 피드백을 직렬로 감시해서(8강) 하나가 붙어 있으면 비상정지 복귀를 거부해요. 브레이크 전원은 사람 안전과 직결돼서 이중화해요 [X-SAFETY]."},

    {"t":"say","text":"모범답안: 안 돼요. 과열로 한 번 떨어지면 원인을 고친 뒤 사람이 RESET-T를 눌러야 복귀해요. 자동 재시작 금지가 이 설계의 불변조건이고, 래치가 풀리면 STO와 브레이크 전원도 같이 끊겨 있어서 저절로 살아나면 위험해요 [X-REGEN·X-COMMISSION]."},

    {"t":"say","text":"TS2는 과열 감시용이에요. 함이 40°C에 닿으면 NC 5-3 접점이 열려서 열 보호 사슬(XTEMP.1)을 끊고 KTH 래치를 떨어뜨려요. 24V 회로라 피드백 N(2번)을 N24에 이어요. [M-RITTAL-STAT·X-COOL]"},
    {"t":"wire","from":"TS2.3","to":"XTEMP.1","color":"red","v":"DC24V","no":"W0423","why":"과열 온도 스위치 TS2의 3번 단자를 온도 접점 단자대 XTEMP의 1번 단자로 이어요. 40°C가 되면 열려서 KTH 래치를 떨어뜨려요. 그래서 0.75㎟ 적색이에요(DC +24V 계열은 적색). TS2.3 쪽은 페룰 PHOENIX AI 0,75-8, 0.5 N·m / XTEMP.1 쪽은 페룰 PHOENIX AI 0,75-8, 0.6 N·m [M-RITTAL-STAT·M-UT·X-WIRE]"},

    {"t":"say","text":"열 계산이에요. 발열 합계 1567.782W(인버터 515+93+83, TR1 48.1, PS1 손실 47.8, DC24 열예산 350.4, BME 10.5, 팬 270, 주회로 여유 150). 외기 35°C 반내 40°C 조건이에요. [D-THERMAL]"},
    {"t":"say","text":"함 표면 방열 205.92W를 빼고 필요 풍량은 953.303m³/h예요. 설치 팬필터는 520×2 = 1040m³/h라서 여유가 있어요. [M-RITTAL-THERMAL]"},
    {"t":"step"},
    {"t":"say","text":"이제 종합이에요. 통전 순서는 6단계예요. 1 무전압 점검(차단·잠금, PE 연속성, 토크, 도면 대조) 2 전원 확인(TR1 218V 탭, PS1 입력 230V·출력 24.0V, BE 별도 220V, 공장 점퍼 제거) [X-COMMISSION]"},
    {"t":"say","text":"3 자동튜닝(기계 분리·낙하 방지, 브레이크는 제조사 절차로 해제, T1-01=0 후 E2 저장) 4 정상 시퀀스(MC 피드백 → RUN → 브레이크 릴레이 ON) 5 비상정지·복귀 시험 6 운전 수락(온도·전류·브레이크 시간 기록). [M-GA700]"},
    {"t":"say","text":"고장 찾기 ① ESTOP을 풀어도 안 올라와요 → SR M52 EDM 체인(8강)을 봐요. 접촉기 NC 31-32가 열린(용접) 곳이나 인버터 M5-M6이 안 닫힌 곳을 순서대로 찾아요."},
    {"t":"say","text":"고장 찾기 ② P004가 OFF예요 → 인버터 3대 중 고장 난 것을 표시창으로 봐요. ③ 브레이크가 안 열려요 → KBE(P02B) → BREN 24V → KB 코일 → KSA·KSB·KB 세 접점 → BME 220V 순서로 짚어요."},
    {"t":"say","text":"고장 찾기 ④ KTH가 떨어졌어요 → 온도 사슬(RB TK, CDBR MB-MC, TS2 5-3) 중 열린 곳을 찾고, 원인을 고친 뒤 RESET-T로 복귀해요. ⑤ 팬이 안 돌아요 → 33°C 미만이면 정상이고, 아니면 CP1S 2.2A·FUF 4A·N선을 봐요."},
    {"t":"say","text":"부장님: 시운전은 빨리 모터부터 돌려 봐야 문제를 알지, 순서가 왜 그렇게 길어?","who":"boss"},
    {"t":"say","text":"모범답안: 순서를 지켜야 사람과 기계가 안전해요. 무전압 점검 없이 올리면 단락, 자동튜닝은 기계를 분리하고 해야 하고(승강 하중을 회전형 튜닝으로 움직이면 안 돼요), 비상정지 시험 없이 운전 수락을 하면 안 돼요. 정적 검사 통과를 실기 수락으로 대신할 수 없어요 [X-COMMISSION]."},
    {"t":"quiz","q":"TS1과 TS2의 설정 온도와 역할은?","a":"TS1 33°C에서 팬 가동(5-4), TS2 40°C에서 열 보호 사슬을 끊어 KTH 래치 해제(5-3) [X-COOL·M-RITTAL-STAT]."},
    {"t":"quiz","q":"함 냉각에서 필요 풍량과 설치 풍량은?","a":"필요 953.303m³/h < 설치 1040m³/h(520×2) [D-THERMAL]."},
    {"t":"quiz","q":"시운전 6단계를 순서대로 말해 보세요.","a":"무전압 점검 → 전원 확인 → 자동튜닝 → 정상 시퀀스 → 비상정지·복귀 → 운전 수락 [X-COMMISSION]."}

(function mergeExtraParts(){

      if(!e||typeof e.draw!=='function'||!(e.w>0)||!(e.h>0)){console.warn('EXTRA_PARTS 건너뜀(형식 오류)',k);continue;}
      if(CAT[k]){console.warn('EXTRA_PARTS 건너뜀(이미 있는 부품)',k);continue;}
      const top=Array.isArray(e.top)?e.top.map(String):[],bot=Array.isArray(e.bot)?e.bot.map(String):[];
      CAT[k]={name:String(e.name||k),w:e.w,h:e.h,top,bot,draw:e.draw,extra:true,noTerm:!top.length&&!bot.length,
        info:e.info?String(e.info):'',ai:e.ai?String(e.ai):''};
      ['lab','pad','sm','lblDy'].forEach(o=>{if(e[o]!=null)CAT[k][o]=e[o];});
      if(e.disp&&typeof e.disp==='object')CAT[k].disp=Object.assign({},e.disp);
      if(e.sim&&typeof e.sim==='object')CAT[k].sim=e.sim;
      if(e.td&&typeof e.td==='object')TD[k]=Object.assign({},e.td);
    }catch(err){console.warn('EXTRA_PARTS 오류',k,err);}
  }
})();

const state={components:{},wires:[],shapes:[]};
let wireUid=0,markList=[],markBoxes=[];
function findComp(id){
  if(state.components[id])return state.components[id];
  const lo=String(id).toLowerCase();
  for(const k in state.components)if(k.toLowerCase()===lo)return state.components[k];
  return null;
}
function findTerm(ref){
  if(typeof ref!=='string')return null;
  const i=ref.indexOf('.');if(i<1)return null;
  const comp=findComp(ref.slice(0,i).trim());if(!comp)return null;
  let t=ref.slice(i+1).trim().toUpperCase();
  if(!comp.terms[t]){
    const maps=[TLBL[comp.type],CAT[comp.type]&&CAT[comp.type].disp];
    for(const rev of maps){if(!rev)continue;let hit=null;for(const k in rev)if(String(rev[k]).toUpperCase()===t){hit=k;break;}if(hit){t=hit;break;}}
  }
  const term=comp.terms[t];if(!term)return null;
  return {comp,id:t,term,ref:comp.id+'.'+t};
}
function termPoint(tr,toY){
  const pts=tr.term.pts;if(pts.length===1)return pts[0];
  const want=toY>tr.comp.y?1:-1;return pts.find(p=>p.dir===want)||pts[0];
}
function locate(at){
  if(typeof at!=='string')return null;
  const tr=findTerm(at);
  if(tr){const p=tr.term.pts.find(p=>p.dir===-1)||tr.term.pts[0];return {x:p.x,y:p.y,dir:p.dir,ref:tr.ref,comp:tr.comp,term:true};}
  const c=findComp(at.trim());
  if(c)return {x:c.x,y:c.y,dir:0,comp:c,term:false,ref:c.id};
  const sh=findShape(at.trim());
  if(sh){const b=sh.bbox;return {x:b.x+b.w/2,y:b.y+b.h/2,dir:0,comp:{gm:{w:b.w,h:b.h}},tip:{x:b.x+b.w-4,y:b.y+b.h/2},term:false,ref:sh.id,shape:sh};}

function findShape(id){
  const lo=String(id).toLowerCase();
  return state.shapes.find(x=>x.id===id)||state.shapes.find(x=>x.id.toLowerCase()===lo)||null;
}

function findSpot(gm,x,y){
  const hw=gm.w/2,hh=gm.h/2,GX=22,GY=36;
  const X=v=>clamp(v,hw+12,1200-hw-12),Y=v=>clamp(v,hh+48,750-hh-46);
  const others=Object.values(state.components);
  const free=(px,py)=>others.every(c=>Math.abs(px-c.x)>=hw+c.gm.w/2+GX||Math.abs(py-c.y)>=hh+c.gm.h/2+GY);
  const x0=X(x),y0=Y(y);
  if(free(x0,y0))return {x:x0,y:y0,moved:x0!==x||y0!==y};
  const cands=[];
  for(let dx=-1200;dx<=1200;dx+=20)for(let dy=-750;dy<=750;dy+=20){const px=x0+dx,py=y0+dy;if(px<hw+12||px>1200-hw-12||py<hh+48||py>750-hh-46)continue;cands.push([dx*dx+dy*dy,px,py]);}
  cands.sort((a,b)=>a[0]-b[0]);
  for(const c of cands)if(free(c[1],c[2]))return {x:c[1],y:c[2],moved:true};
  return {x:x0,y:y0,moved:true};
}

/* 애니메이션 도우미 */
function revealPaths(root,R,ms){
  const d=R.dur(ms);
  if(d<=0)return;
  root.querySelectorAll('.sk path, .sk line, .sk rect, .sk circle, .sk ellipse').forEach(el=>{
    try{
      const stroke=el.getAttribute('stroke');
      if(el.tagName==='path'&&stroke&&stroke!=='none'){
        const len=el.getTotalLength();if(!isFinite(len)||len<=0)return;
        el.style.strokeDasharray=len+' '+len;
        const a=el.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:d,easing:'ease-in-out',fill:'forwards'});
        a.onfinish=()=>{el.style.strokeDasharray='';try{a.cancel();}catch(e){}};
      }else{
        el.animate([{opacity:0},{opacity:0,offset:.4},{opacity:1}],{duration:d,fill:'backwards'});
      }
    }catch(e){}
  });
}
function fadeIn(el,R,ms,delay){const d=R.dur(ms);if(d<=0)return;try{el.animate([{opacity:0},{opacity:1}],{duration:d,delay:delay?R.dur(delay):0,fill:'backwards'});}catch(e){}}

function buildComp(op,R,turn,opts){
  const type=String(op.type||'').toUpperCase();
  if(!CAT[type]){console.warn('모르는 부품 type',op.type);return null;}
  let id=String(op.id==null||op.id===''?type+(Object.keys(state.components).length+1):op.id).replace(/[^\w\-가-힣]/g,'_');
  const props={};
  ['label','color','kind','n'].forEach(k=>{if(op[k]!=null)props[k]=op[k];});
  if(op.props&&typeof op.props==='object')Object.assign(props,op.props);
  props.label=props.label!=null?String(props.label).slice(0,24):'';
  if(state.components[id])removeComp(id,true);
  const gm=geom(type,props);
  const spot=(R&&R.kind==='ai')?findSpot(gm,Number(op.x)||600,Number(op.y)||375):{x:Number(op.x)||600,y:Number(op.y)||375,moved:false};
  if(spot.moved)console.info('부품 위치 조정',id,spot);
  const cat=CAT[type];
  const g=s('g',{transform:`translate(${spot.x},${spot.y})`,'data-comp':id});
  const comp={id,type,x:spot.x,y:spot.y,props,gm,g,terms:{},tg:s('g',{transform:`translate(${spot.x},${spot.y})`})};
  const p=new Pen(g,hashSeed(id+type));
  try{cat.draw(p,{w:gm.w,h:gm.h,props,n:gm.n});}catch(e){console.warn('부품 그리기 오류',type,e);}
  // 몸통 클릭 영역
  g.insertBefore(s('rect',{x:-gm.w/2,y:-gm.h/2,width:gm.w,height:gm.h,fill:'transparent','data-compbody':id}),g.firstChild);
  // 단자
  const tg=comp.tg,lblFs=cat.sm?'tl sm':'tl';
  const addSide=(ids,dir)=>ids.forEach((tid,i)=>{
    const lx=-gm.w/2+gm.pad+(gm.w-2*gm.pad)*(i+.5)/ids.length;
    const ly=dir<0?-gm.h/2:gm.h/2;
    const ax=spot.x+lx,ay=spot.y+ly;
    if(!comp.terms[tid])comp.terms[tid]={pts:[]};
    comp.terms[tid].pts.push({x:ax,y:ay,dir});
    const sp=gm.w/ids.length>=22?4.6:3.8;
    const sg=s('g',{class:'term ft','data-ref':id+'.'+tid});
    sg.append(s('circle',{cx:lx,cy:ly,r:sp,class:'screw'}),s('line',{x1:lx-sp*.6,y1:ly-sp*.3,x2:lx+sp*.6,y2:ly+sp*.3,class:'slot'}));
    if(!cat.noLbl){
      const dy=(cat.lblDy&&cat.lblDy[dir<0?'top':'bot'])||0;
      const t=s('text',{x:lx,y:dir<0?ly+16+dy:ly-9+dy,class:lblFs},tdisp(type,tid));sg.append(t);
    }
    if(cat.led&&dir>0){sg.append(s('circle',{cx:lx,cy:ly-gm.h+22,r:3.4,fill:'#f4f1e4',stroke:INK.pencil,'stroke-width':1}));}
    sg.append(s('circle',{cx:lx,cy:ly,r:12,class:'hit','data-ref':id+'.'+tid}));
    tg.append(sg);
  });
  addSide(gm.top,-1);addSide(gm.bot,1);
  // 라벨
  if(!(cat.noTerm&&!props.label)){ // 단자 없는 그림 부품은 label이 있을 때만 이름을 쓴다
    const lab=props.label||id;
    const lp=type==='TB'?[-gm.w/2-8,6,'end']:(cat.lab||[gm.w/2+8,-gm.h/2+16,'start']);
    const lx=lp[0]==null?0:lp[0];
    const lt=s('text',{x:lx,y:lp[1],class:'cl','text-anchor':lp[2]||'start'},lab);
    if(lp[3])lt.style.fontSize=lp[3]+'px';
    lt.classList.add('ft');g.appendChild(lt);
  }
  state.components[id]=comp;
  gComps.appendChild(g);gTerms.appendChild(tg);
  if(turn)turn.comps.push(id);
  delete SIM.st[id];simDirty();
  return comp;
}
function removeComp(id,silent){

function tidyPts(pts){

function typeInto(p,text,per,instant){

    for(const ch of Array.from(w)){const c=h('span',{class:'c',text:ch});if(!instant)c.style.animationDelay=(i*per)+'ms';ws.append(c);i++;}

function markupChars(text,auto){

    push(s0.slice(l2),'');
  };
  while((m=re.exec(text))){plain(text.slice(last,m.index));push(m[1]!=null?m[1]:m[2],m[1]!=null?'b':'r');last=m.index+m[0].length;}

const laserEl=$('#laser'),gLaser=$('#gLaser');
const BEAT={last:null};let laserTm=0;
function laserTarget(text){
  const mt=text.match(/[A-Za-z_][\w]*\.[A-Za-z0-9+\-]+/g)||[];
  for(const m of mt){const tr=findTerm(m);if(tr){const p=tr.term.pts[0];return {x:p.x,y:p.y,r:17};}}
  let best=null;
  const test=(key,fn)=>{
    if(!key||String(key).length<2)return;
    const mm=new RegExp('(^|[^A-Za-z0-9_])'+escRe(key)+'(?![A-Za-z0-9_])').exec(text);
    if(mm&&(!best||mm.index<best.i))best={i:mm.index,pt:fn()};
  };
  for(const id in state.components){const c=state.components[id];
    const fn=()=>({x:c.x,y:c.y,r:Math.min(90,Math.max(c.gm.w,c.gm.h)/2+12)});
    test(id,fn);test(c.props.label,fn);}
  state.shapes.forEach(sh=>{if(sh.id.charAt(0)==='_')return;test(sh.id,()=>({x:sh.bbox.x+sh.bbox.w/2,y:sh.bbox.y+sh.bbox.h/2,r:Math.min(110,Math.max(sh.bbox.w,sh.bbox.h)/2+10)}));});
  return best?best.pt:BEAT.last;
}
function laserOff(){laserTm++;laserEl.style.opacity=0;gLaser.textContent='';}
function laserTo(pt,R){
  if(!pt||(R&&R.fast))return;
  const my=++laserTm,mo=!reduced(),ms=mo?500/speed:0;
  if(laserEl.style.opacity!=='1'){laserEl.style.transition='none';laserEl.style.transform='translate('+(pt.x+70)+'px,'+(pt.y-60)+'px)';void laserEl.offsetWidth;}
  laserEl.style.transition=ms?'transform '+ms+'ms ease-in-out,opacity .2s':'opacity .2s';
  laserEl.style.opacity=1;laserEl.style.transform='translate('+pt.x+'px,'+pt.y+'px)';
  setTimeout(()=>{
    if(my!==laserTm)return;
    gLaser.textContent='';
    const r=pt.r||20,N=40,a0=-2.2,pts=[];
    for(let i=0;i<=N;i++){const k=i/N,a=a0+k*Math.PI*2*1.08,rr=1+.04*Math.sin(k*14);pts.push((pt.x+Math.cos(a)*r*rr).toFixed(1)+','+(pt.y+Math.sin(a)*r*rr).toFixed(1));}
    const path=s('path',{d:'M'+pts.join(' L'),fill:'none',stroke:'#e0201b','stroke-width':3.4,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.92});
    gLaser.append(path);
    if(mo){const len=path.getTotalLength();path.style.strokeDasharray=len+' '+len;try{const a=path.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:600/speed,fill:'forwards'});a.onfinish=()=>{path.style.strokeDasharray='';};}catch(e){}}
  },ms+800/speed);
  setTimeout(()=>{if(my===laserTm){laserEl.style.opacity=0;gLaser.textContent='';}},ms+800/speed+2200);
}

/* ----- 카메라 ----- */
const CAM={user:false,box:null,raf:0};
function camUser(){CAM.user=true;if(CAM.raf){cancelAnimationFrame(CAM.raf);CAM.raf=0;}}
function camBeat(){CAM.user=false;CAM.box=null;BEAT.last=null;}
function camGoal(box){
  const r=wrap.getBoundingClientRect(),W=r.width,H=r.height,fit=Math.min(W/1200,H/750);
  const home={z:1,tx:(W-1200*fit)/2,ty:(H-750*fit)/2};
  if(!box||!W||!H)return home;
  const goalFor=b=>{
    const k=Math.min(W*.7/Math.max(b.w,60),H*.7/Math.max(b.h,40)),z=clamp(k/fit,1,2.2);
    if(z<=1.03)return home;
    const kk=fit*z;return {z,tx:W/2-(b.x+b.w/2)*kk,ty:H/2-(b.y+b.h/2)*kk};
  };
  const vis=g=>{const kk=fit*g.z;return {x:-g.tx/kk,y:-g.ty/kk,w:W/kk,h:H/kk};};
  const frac=(o,v)=>{
    const ix=Math.min(o.x+o.w,v.x+v.w)-Math.max(o.x,v.x),iy=Math.min(o.y+o.h,v.y+v.h)-Math.max(o.y,v.y);
    return (ix<=0||iy<=0)?0:(ix*iy)/Math.max(1,o.w*o.h);
  };
  let tb=null;try{const bb=gTitle.getBBox();if(bb&&bb.width>0)tb={x:bb.x,y:bb.y,w:bb.width,h:bb.height+12};}catch(e){}
  const others=[];
  Object.values(state.components).forEach(c=>{const b=boxOfComp(c);if(b.w*b.h>=3600)others.push(b);});
  state.shapes.forEach(sh=>{const b=sh.bbox;if(b&&b.w*b.h>=3600)others.push(b);});
  let b=box,g=goalFor(b);
  const partials=v=>{const o2=[];
    if(tb){const f=frac(tb,v);if(f>.005&&f<.98)o2.push(tb);}
    others.forEach(o=>{const f=frac(o,v);if(f>.005&&f<.3)o2.push(o);});
    return o2;};
  for(let it=0;it<6&&g.z>1.03;it++){
    const ps=partials(vis(g));if(!ps.length)break;
    const nb=unionBox([b].concat(ps)),ng=goalFor(nb);
    if(ng.z>=1.15){b=nb;g=ng;continue;}
    g=home; // 넓히면 줌이 거의 없어지므로 전체 보기가 낫다
    break;
  }
  return g;
}
function camMove(g,R){
  if(CAM.raf){cancelAnimationFrame(CAM.raf);CAM.raf=0;}
  if(!R||R.fast||reduced()||R.dur(1)===0){V.z=g.z;V.tx=g.tx;V.ty=g.ty;viewApply();return;}
  const s0={z:V.z,tx:V.tx,ty:V.ty},t0=performance.now(),dur=700/Math.max(.5,speed);
  const step=now=>{
    const k=clamp((now-t0)/dur,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    V.z=s0.z+(g.z-s0.z)*e;V.tx=s0.tx+(g.tx-s0.tx)*e;V.ty=s0.ty+(g.ty-s0.ty)*e;viewApply();
    CAM.raf=k<1?requestAnimationFrame(step):0;
  };
  CAM.raf=requestAnimationFrame(step);
}
function camTouch(box,R){
  if(!box)return;
  BEAT.last={x:box.x+box.w/2,y:box.y+box.h/2,r:Math.min(110,Math.max(box.w,box.h)/2+10)};
  if(CAM.user)return;
  CAM.box=CAM.box?unionBox([CAM.box,box]):box;
  camMove(camGoal(CAM.box),R);
}
function camFit(R){CAM.box=null;if(!CAM.user)camMove(camGoal(null),R);}
const boxOfComp=c=>({x:c.x-c.gm.w/2,y:c.y-c.gm.h/2,w:c.gm.w,h:c.gm.h});
function boxOfWire(w){
  const xs=w.pts.map(p=>p[0]),ys=w.pts.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys);
  return {x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y};
}

let speed=1;
const lessonRunner=makeRunner('lesson'),aiRunner=makeRunner('ai'),demoRunner=makeRunner('demo');
function makeRunner(kind){
  const R={kind,queue:[],tok:0,running:false,fast:false,waiting:null,sleeps:new Set(),onIdle:null};
  R.dur=ms=>(R.fast||reduced())?0:ms/speed;
  R.sleep=function(ms){
    const tok=R.tok,d=R.dur(ms);
    return new Promise((res,rej)=>{
      if(d<=0){tok===R.tok?res():rej(CANCEL);return;}
      const o={};
      o.t=setTimeout(()=>{R.sleeps.delete(o);tok===R.tok?res():rej(CANCEL);},d);
      o.fin=()=>{clearTimeout(o.t);R.sleeps.delete(o);tok===R.tok?res():rej(CANCEL);};
      R.sleeps.add(o);
    });
  };
  R.push=function(ops,turn){for(const op of ops)R.queue.push({op,turn});R.kick();};
  R.reset=function(){R.tok++;R.queue=[];R.running=false;R.fast=false;if(R.waiting){const w=R.waiting;R.waiting=null;w();}R.flush();};
  R.flush=function(){for(const o of Array.from(R.sleeps))o.fin();document.getAnimations().forEach(a=>{try{a.finish();}catch(e){}});};
  R.kick=async function(){
    if(R.running)return;R.running=true;const tok=R.tok;
    try{
      while(R.queue.length){
        if(tok!==R.tok)return;
        const it=R.queue.shift();
        try{await runOp(it.op,R,it.turn);}catch(e){if(e===CANCEL)return;console.warn('op 오류',it.op,e);}
      }
    }finally{
      if(tok===R.tok){R.running=false;if(!R.queue.length&&R.onIdle)R.onIdle();}
    }
  };
  return R;
}
const SCENE=[]; // 마지막 clear 이후 그려진 title/place/wire/remove — demo 다시 보기 때 칠판을 복원하는 데 쓴다
async function runOp(op,R,turn){
  if(!op||typeof op!=='object'||typeof op.t!=='string'){console.warn('잘못된 op',op);return;}
  const tok=R.tok,live=R.kind==='lesson'||R.kind==='ai';
  if(R.kind!=='boot'&&(op.t==='place'||op.t==='wire'||op.t==='remove'||op.t==='title'))SCENE.push(op);
  if(R.kind==='lesson'&&op.t!=='step'&&op.t!=='beat')L.since++;
  switch(op.t){
    case 'title':setTitle(op.text,R);await R.sleep(400);break;
    case 'say':await opSay(op,R,turn);await beatPause(R,tok);break;
    case 'place':{
      const c=buildComp(op,R,turn);if(!c)break;
      revealPaths(c.g,R,520);fadeIn(c.tg,R,300,300);
      if(live)camTouch(boxOfComp(c),R);
      await R.sleep(560);break;}
    case 'wire':{const w=buildWire(op,R,turn);if(w){if(live)camTouch(boxOfWire(w),R);await R.sleep(740);}break;}
    case 'mark':{const m=buildMark(op,R,turn);if(m)await R.sleep(520);break;}
    case 'circle':{const m=buildCircle(op,R,turn);if(m)await R.sleep(680);break;}
    case 'text':case 'line':case 'box':case 'ring':case 'slot':case 'dim':case 'wave':case 'table':case 'ladder':{
      const sh=buildShape(op,R,turn);
      if(sh){
        if(live){ // 이미 다른 그림이 있는 칠판에 글자만 더할 땐 카메라가 따라가지 않는다(레이저만)
          const soft=sh.kind==='text'&&(Object.keys(state.components).length>0||state.shapes.length>1);
          if(soft){
            BEAT.last={x:sh.bbox.x+sh.bbox.w/2,y:sh.bbox.y+sh.bbox.h/2,r:Math.min(110,Math.max(sh.bbox.w,sh.bbox.h)/2+10)};
            if(CAM.box&&!CAM.user)camMove(camGoal(CAM.box),R); // 새 글자가 화면 경계에 걸치지 않게 다시 계산
          }
          else camTouch(sh.bbox,R);
        }
        await R.sleep(Math.min(1400,sh.ms)+120);}
      break;}
    case 'anim':{const sh=buildAnim(op,R,turn);if(sh){if(live)camTouch(sh.bbox,R);await R.sleep(700);}break;}
    case 'act':{ // 본문 act: 한 번 실행하고 계속 (anim 또는 클릭 가능한 부품)
      if(!SIM.on)simEnable(true,true);
      await demoStep(op,R,turn);
      if(!R.fast)setTimeout(()=>{if(!DM.busy)hideFinger();},700);
      break;}
    case 'remove':{
      const key=String(op.id||''),id=findComp(key);
      if(id)removeComp(id.id);
      else{const sh=findShape(key);if(sh)removeShape(sh);else console.warn('remove: 없는 부품/도형',op.id);}
      await R.sleep(200);break;}
    case 'clear':{
      clearBoard();hideCaption();laserOff();camFit(R);
      if(margin.lastElementChild&&!margin.lastElementChild.classList.contains('cut'))margin.append(h('hr',{class:'cut'}));
      await R.sleep(250);break;}
    case 'quiz':addQuiz(op,turn);await R.sleep(300);break;
    case 'demo':await playDemo(op,R,turn);break;
    case 'step':case 'beat':{
      if(R.kind==='lesson'&&L.since>0)await beatPause(R,tok);
      break;}
    default:console.warn('모르는 op',op.t);
  }
}
